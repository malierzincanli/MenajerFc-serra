<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menajer FC v4</title>
<style>
:root{
  --bg:#edf1ee;
  --bg-grid:rgba(16,25,20,.035);
  --c:#ffffff;
  --c2:#f4f7f5;
  --t:#111915;
  --m:#56665d;
  --a:#157a47;
  --b:#d3ddd6;
  --ok:#0f9d68;
  --warn:#d97706;
  --bad:#dc2626;
  --gold:#b45309;
  --blue:#2563eb;
  --ink:#0d1511;
  --paper:#fcfbf7;
  --paper-b:#d8d2c5;
  --shadow:0 4px 18px rgba(10,20,14,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0a100d;
    --bg-grid:rgba(255,255,255,.028);
    --c:#121c17;
    --c2:#18251e;
    --t:#ecf3ee;
    --m:#8da195;
    --b:#24352c;
    --ok:#10b981;
    --warn:#f59e0b;
    --bad:#ef4444;
    --blue:#3b82f6;
    --ink:#090e0b;
    --paper:#151d18;
    --paper-b:#2d3d34;
    --shadow:0 8px 26px rgba(0,0,0,.38);
  }
}
:root[data-theme=dark]{
  --bg:#0a100d;
  --bg-grid:rgba(255,255,255,.028);
  --c:#121c17;
  --c2:#18251e;
  --t:#ecf3ee;
  --m:#8da195;
  --b:#24352c;
  --ok:#10b981;
  --warn:#f59e0b;
  --bad:#ef4444;
  --blue:#3b82f6;
  --ink:#090e0b;
  --paper:#151d18;
  --paper-b:#2d3d34;
  --shadow:0 8px 26px rgba(0,0,0,.38);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  background-color:var(--bg);
  background-image:
    linear-gradient(to right,var(--bg-grid) 1px,transparent 1px),
    linear-gradient(to bottom,var(--bg-grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--t);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;
}
#app{max-width:480px;margin:auto;padding:10px 12px 94px}
.num{font-variant-numeric:tabular-nums}
.ico{display:inline-block;vertical-align:-0.18em;flex-shrink:0}

/* Toast Notification */
#toast-box{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;
  transform:translateX(-50%);z-index:100;width:calc(100% - 24px);max-width:456px;
  display:flex;flex-direction:column;gap:6px;pointer-events:none;
}
.toast{
  background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;
  font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);
  animation:toastIn .22s ease;pointer-events:auto;
}
.toast.ok{background:#065f46;border-color:#10b981}
.toast.bad{background:#7f1d1d;border-color:#ef4444}
.toast.warn{background:#78350f;border-color:#f59e0b}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* Typography & Layout */
.lbl{
  font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--m);margin-bottom:5px;display:flex;align-items:center;gap:5px;
}
.m{color:var(--m);font-size:12.5px}
.big{font-size:23px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

/* Cards */
.c{
  background:var(--c);border:1px solid var(--b);border-radius:16px;
  padding:13px;margin:10px 0;box-shadow:var(--shadow);
}
.c2{
  background:var(--c2);border:1px solid var(--b);border-radius:12px;
  padding:10px;margin:8px 0;
}
.hd{
  background:linear-gradient(145deg,color-mix(in srgb,var(--a) 88%,#0a1610),color-mix(in srgb,var(--a) 28%,#08110c));
  color:#fff;border-radius:18px;padding:14px;margin:8px 0 10px;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 10px 26px rgba(0,0,0,.22);
  position:relative;overflow:hidden;
}
.hd::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(to right,rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:18px 18px;
}
.hd > *{position:relative;z-index:1}
.hd .m{color:rgba(255,255,255,.78)}

/* Buttons */
button{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;margin:6px 0;padding:11px 12px;border:0;border-radius:11px;
  background:var(--a);color:#fff;font:700 13.5px inherit;cursor:pointer;
  transition:transform .12s ease,opacity .15s,background .15s,border-color .15s;
  min-height:44px;
}
button:active{transform:scale(.978)}
button:disabled{opacity:.42;cursor:not-allowed;transform:none}
button.x{
  background:var(--c2);color:var(--t);border:1px solid var(--b);font-weight:600;
  justify-content:flex-start;text-align:left;
}
button.x.center{justify-content:center;text-align:center}
button.x.on{
  background:color-mix(in srgb,var(--a) 14%,var(--c2));
  border-color:var(--a);color:var(--a);
}
button.sm{
  padding:7px 10px;font-size:12px;margin:0;width:auto;min-height:34px;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
}
button.ic{
  width:36px;height:36px;min-height:36px;padding:0;margin:0;border-radius:10px;
  background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.16);
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
}
button.danger{background:var(--bad);color:#fff}
button.ok-btn{background:var(--ok);color:#fff}
select,input{
  width:100%;padding:10px 12px;border-radius:10px;
  border:1px solid var(--b);background:var(--c2);color:var(--t);
  font:14px inherit;margin:4px 0;
}

/* Segmented Controls */
.seg{
  display:flex;background:var(--c2);border:1px solid var(--b);
  border-radius:11px;padding:3px;gap:3px;margin:5px 0;
}
.seg button{
  flex:1;margin:0;padding:7px 4px;border-radius:8px;min-height:34px;
  background:transparent;color:var(--m);font-size:11.5px;font-weight:700;
  line-height:1.2;border:0;justify-content:center;text-align:center;
}
.seg button.on{background:var(--a);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.seg button.warn.on{background:var(--warn);color:#111}
.seg button.bad.on{background:var(--bad);color:#fff}

/* Pills & Badges */
.bd{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.12);
  font-size:11px;font-weight:700;white-space:nowrap;
}
.pill{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;
  font-size:11px;font-weight:700;margin:2px 3px 2px 0;font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.pill.pos{background:rgba(16,185,129,.14);color:var(--ok);border:1px solid rgba(16,185,129,.35)}
.pill.neg{background:rgba(239,68,68,.14);color:var(--bad);border:1px solid rgba(239,68,68,.35)}
.pill.neu{background:rgba(245,158,11,.15);color:var(--warn);border:1px solid rgba(245,158,11,.35)}
.pill.info{
  background:color-mix(in srgb,var(--a) 14%,transparent);
  color:var(--a);border:1px solid color-mix(in srgb,var(--a) 34%,transparent);
}
.pill.euro{background:rgba(37,99,235,.16);color:#60a5fa;border:1px solid rgba(59,130,246,.4)}

/* Toggle Switch */
.tog-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 10px;background:var(--c2);border:1px solid var(--b);border-radius:11px;margin:6px 0;
}
.switch{
  position:relative;width:42px;height:24px;min-height:24px;border-radius:99px;
  background:var(--b);border:0;padding:0;margin:0;cursor:pointer;flex-shrink:0;
  transition:background .2s;
}
.switch.on{background:var(--a)}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;
  border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);
  transition:transform .2s;
}
.switch.on::after{transform:translateX(18px)}

/* Status Bars */
.bar-wrap{margin:7px 0}
.bar-hd{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:3px;gap:6px}
.bar-val{font-weight:800;font-variant-numeric:tabular-nums}
.br{height:7px;background:var(--b);border-radius:99px;overflow:hidden}
.br i{display:block;height:100%;border-radius:99px;transition:width .35s ease,background .35s ease}
.bar-bad i{background:var(--bad)}
.bar-ok i{background:var(--ok)}
.bar-norm i{background:var(--a)}
.bar-warn i{background:var(--warn)}

/* Assistant Advice Banner */
.asst-band{
  background:linear-gradient(90deg,color-mix(in srgb,var(--a) 12%,var(--c)),var(--c));
  border:1px solid color-mix(in srgb,var(--a) 35%,var(--b));
  border-left:4px solid var(--a);
  border-radius:13px;padding:10px 12px;margin:8px 0;box-shadow:var(--shadow);
}

/* Ultimatum, Debt & Modifiers */
.ult-banner{
  background:linear-gradient(135deg,#991b1b,#5c1010);color:#fff;
  border-radius:14px;padding:11px 13px;margin:8px 0;
  border:1px solid #ef4444;box-shadow:0 4px 16px rgba(239,68,68,.28);
  animation:pulseBorder 2s infinite;
}
.debt-banner{
  background:linear-gradient(135deg,#78350f,#451a03);color:#fff;
  border-radius:14px;padding:11px 13px;margin:8px 0;
  border:1px solid #f59e0b;box-shadow:0 4px 14px rgba(245,158,11,.25);
}
@keyframes pulseBorder{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.42)}
  50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}
}
.mb{
  background:linear-gradient(90deg,rgba(245,158,11,.13),transparent);
  border:1px solid var(--b);border-left:3.5px solid var(--warn);
  border-radius:11px;padding:8px 10px;margin:6px 0;
}

/* Editorial Sports Newspaper / Masthead Card */
.ed-card{
  background:var(--paper);border:1px solid var(--paper-b);border-radius:14px;
  overflow:hidden;margin:10px 0;box-shadow:var(--shadow);
}
.ed-accent{height:4px;background:var(--bad)}
.ed-accent.press{background:#1d4ed8}
.ed-accent.derby{background:#b45309}
.ed-accent.sim{background:var(--a)}
.ed-mast{
  padding:8px 14px 7px;border-bottom:3px double var(--paper-b);
  display:flex;justify-content:space-between;align-items:center;
  font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  color:var(--m);
}
.ed-mast strong{color:var(--t);font-family:Georgia,"Times New Roman",serif;font-size:11.5px;letter-spacing:.1em}
.ed-body{padding:14px}
.ed-kicker{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--bad);margin-bottom:6px;
}
.ed-kicker.press{color:#2563eb}
.ed-kicker.derby{color:var(--warn)}
.ed-kicker.sim{color:var(--a)}
.ed-hl{
  font-family:Georgia,"Times New Roman",serif;
  font-size:19px;font-weight:700;line-height:1.25;margin:0 0 8px;
  letter-spacing:-.015em;color:var(--t);
}
.ed-quote{
  border-left:3px solid var(--paper-b);padding:6px 10px;margin:8px 0 12px;
  font-style:italic;color:var(--m);font-size:13px;background:rgba(127,127,127,.05);
}

/* Broadcast Match HUD */
.bcast{
  background:linear-gradient(180deg,#0c1410,#15221b);color:#fff;
  border-radius:16px;padding:10px 12px;margin:6px 0 8px;
  border:1px solid #283b30;box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.bcast.glow{box-shadow:0 0 20px 3px rgba(250,204,21,.45);border-color:#facc15}
.bcast-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team-side{display:flex;align-items:center;gap:7px;min-width:0}
.team-side.away{justify-content:flex-end;text-align:right}
.tname{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-box{
  text-align:center;background:rgba(0,0,0,.48);
  border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:4px 10px;
}
.score-num{font-size:22px;font-weight:900;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1.1}
.live-min{
  font-size:11px;font-weight:800;color:#4ade80;
  display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;
}
.live-dot{width:6px;height:6px;border-radius:50%;background:#ef4444;display:inline-block;animation:blink 1s infinite}
.live-dot.paused{background:#f59e0b;animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* Live Momentum Sparkline */
.spark-box{margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.1)}
.spark-svg{width:100%;height:46px;display:block;border-radius:8px;background:rgba(0,0,0,.28)}

/* 2D Match Pitch */
.pt{
  position:relative;height:142px;border-radius:14px;
  background:repeating-linear-gradient(90deg,#1e7d43 0 10%,#1a713c 10% 20%);
  border:2px solid rgba(255,255,255,.5);overflow:hidden;margin:6px 0;
  box-shadow:inset 0 0 26px rgba(0,0,0,.38);
}
.pt svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.52}
.ball-dot{
  position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff 0%,#e5e7eb 60%,#9ca3af 100%);
  border:1.5px solid #111;box-shadow:0 2px 5px rgba(0,0,0,.65);
  transition:left .2s linear,top .2s linear;z-index:4;
}
.pl{
  position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.88),0 2px 4px rgba(0,0,0,.45);
  transition:left .3s ease,top .3s ease;z-index:2;
}
.gb{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font:900 20px inherit;letter-spacing:.06em;color:#fff;text-align:center;padding:8px;
  text-shadow:0 3px 12px #000;background:rgba(8,14,11,.74);z-index:5;animation:pop .24s ease;
}
.gb.goal{background:linear-gradient(90deg,rgba(6,95,70,.88),rgba(16,185,129,.82))}
.gb.concede{background:linear-gradient(90deg,rgba(127,29,29,.88),rgba(220,38,38,.82))}
.gb.save{background:linear-gradient(90deg,rgba(30,58,138,.88),rgba(37,99,235,.82))}
.gb.card{background:linear-gradient(90deg,rgba(153,27,27,.92),rgba(180,83,9,.85))}
.gb small{font-size:12px;font-weight:700;opacity:.92;letter-spacing:.02em;margin-top:2px}
@keyframes pop{from{transform:scale(.82);opacity:0}}

/* Squad Pitch (450px calibrated) */
.pt2{
  position:relative;height:450px;border-radius:16px;
  background:repeating-linear-gradient(0deg,#1f7f44 0 10%,#1b733d 10% 20%);
  border:2px solid rgba(255,255,255,.5);
  box-shadow:inset 0 0 34px rgba(0,0,0,.38),var(--shadow);
  margin:10px 0;overflow:hidden;
}
.pt2 svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.48}
.jr{
  position:absolute;transform:translate(-50%,-50%);
  text-align:center;font-size:10.5px;color:#fff;cursor:pointer;
  width:62px;padding:2px 0;transition:transform .12s;user-select:none;
}
.jr:active{transform:translate(-50%,-50%) scale(.93)}
.jr.sel{filter:drop-shadow(0 0 8px rgba(255,255,255,.95))}
.jr-kit{position:relative;display:inline-flex;align-items:center;justify-content:center}
.jr-cap{
  position:absolute;top:-2px;right:-4px;background:#facc15;color:#111;
  font-size:8.5px;font-weight:900;width:14px;height:14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.5);
}
.jr-role{
  position:absolute;top:-2px;left:-6px;background:rgba(0,0,0,.65);color:rgba(255,255,255,.85);
  font-size:7.5px;font-weight:800;padding:1px 3px;border-radius:4px;letter-spacing:.02em;
}
.jn{
  text-shadow:0 1px 3px #000;font-weight:700;font-size:10.5px;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
}
.jo{
  display:inline-flex;align-items:center;gap:3px;justify-content:center;
  background:rgba(7,14,10,.76);border:1px solid rgba(255,255,255,.16);
  border-radius:7px;padding:1px 5px;font-variant-numeric:tabular-nums;
  font-weight:800;font-size:10px;margin-top:1px;
}
.jo span.fit{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.st-micro{
  width:38px;height:3.5px;background:rgba(0,0,0,.55);border-radius:99px;
  overflow:hidden;margin:2px auto 0;
}
.st-micro i{display:block;height:100%;border-radius:99px}

/* Color-Coded Match Log */
.mlog{
  max-height:112px;overflow-y:auto;font-size:12px;line-height:1.45;
  padding:8px 10px;background:var(--c);border:1px solid var(--b);
  border-radius:12px;margin:6px 0;
}
.mlog-item{
  padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--b) 45%,transparent);
  display:flex;gap:6px;align-items:center;
}
.mlog-item:last-child{border-bottom:0}
.ltag{
  font-size:9.5px;font-weight:900;letter-spacing:.04em;padding:2px 6px;border-radius:5px;
  flex-shrink:0;text-transform:uppercase;
}
.ltag.gol{background:rgba(16,185,129,.18);color:var(--ok)}
.ltag.yenilen{background:rgba(239,68,68,.18);color:var(--bad)}
.ltag.kart{background:rgba(245,158,11,.22);color:var(--warn)}
.ltag.kart-r{background:#dc2626;color:#fff}
.ltag.deg{background:rgba(59,130,246,.18);color:var(--blue)}
.ltag.taktik{background:rgba(127,127,127,.18);color:var(--m)}
.ltag.kurt{background:rgba(20,184,166,.18);color:#14b8a6}

/* Mini-Game Arcade Arena */
.mg-card{
  background:linear-gradient(180deg,#0f1a14,#15241c);color:#fff;
  border:2px solid #2b4436;border-radius:18px;padding:14px;margin:8px 0;
  box-shadow:0 12px 30px rgba(0,0,0,.4);user-select:none;touch-action:manipulation;
}
.mg-flash{
  min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:10px;animation:pop .25s ease;
}
.mg-flash-ic{
  width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 28px rgba(255,255,255,.22);
}
.mg-cmd{
  font-size:16px;font-weight:900;text-align:center;letter-spacing:-.01em;margin:4px 0 8px;
}
.mg-svg-wrap{
  position:relative;width:100%;border-radius:14px;overflow:hidden;
  background:#175c32;border:2px solid rgba(255,255,255,.35);
  box-shadow:inset 0 0 24px rgba(0,0,0,.4);margin:6px 0;
  touch-action:manipulation;
}
.mg-goal-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:14px 12px 10px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 8px,transparent 8px 16px);
  border:5px solid #f8fafc;border-bottom:0;border-radius:10px 10px 0 0;margin:8px 6px 0;
}
.mg-zone{
  min-height:58px;border-radius:10px;background:rgba(16,185,129,.18);
  border:2px dashed rgba(255,255,255,.45);color:#fff;font-weight:800;font-size:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .1s,background .15s,border-color .15s;margin:0;padding:6px;
}
.mg-zone:active{transform:scale(.94);background:rgba(16,185,129,.45)}
.mg-zone.hot{background:rgba(239,68,68,.52);border-color:#fca5a5;border-style:solid;animation:pulseHot .45s infinite}
.mg-zone.fake{background:rgba(250,204,21,.45);border-color:#fde047;border-style:solid}
.mg-zone.hit{background:rgba(16,185,129,.65);border-color:#4ade80;border-style:solid}
.mg-zone.blocked{background:rgba(239,68,68,.28);border-color:#ef4444;border-style:solid;opacity:.6;cursor:not-allowed}
@keyframes pulseHot{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

.mg-bar{position:relative;height:28px;background:rgba(255,255,255,.14);border-radius:10px;overflow:hidden;margin:10px 0;border:1px solid rgba(255,255,255,.2)}
.mg-zn{position:absolute;top:0;bottom:0;background:#10b981;opacity:.75}
.mg-mk{position:absolute;top:0;bottom:0;width:8px;background:#fff;border-radius:4px;box-shadow:0 0 8px #fff}
.mg-timer{height:6px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin:6px 0}
.mg-timer i{display:block;height:100%;background:#38bdf8;border-radius:99px}

/* Penalty Shootout Scoreboard */
.pen-board{
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.16);
  border-radius:12px;padding:10px 12px;margin-bottom:8px;
}
.pen-dots{display:flex;gap:5px;align-items:center}
.pen-dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid rgba(255,255,255,.45)}
.pen-dot.hit{background:#10b981;border-color:#4ade80}
.pen-dot.miss{background:#ef4444;border-color:#fca5a5}

.b2{position:relative;height:26px;background:var(--b);border-radius:10px;overflow:hidden;margin:10px 0}
.zn{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.65}
#mk{position:absolute;top:0;bottom:0;width:6px;background:var(--t);border-radius:3px}

/* Chips, Tables, Scenario Cards */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:6px 9px;margin:3px;
  border-radius:10px;background:var(--c2);border:1px solid var(--b);
  font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums;
  transition:border-color .12s,transform .1s;
}
.chip:active{transform:scale(.96)}
.chip.sel{border-color:var(--a);background:color-mix(in srgb,var(--a) 15%,var(--c2))}
.chip.unavail{opacity:.65;border-style:dashed}
.scen{
  background:var(--c2);border:1.5px solid var(--b);border-radius:13px;
  padding:11px 12px;margin:8px 0;cursor:pointer;
  transition:border-color .15s,transform .12s,background .15s;
}
.scen:active{transform:scale(.985)}
.scen.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 10%,var(--c2))}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;text-align:right;border-bottom:1px solid color-mix(in srgb,var(--b) 55%,transparent)}
td:first-child,th:first-child{text-align:left}
th{font-size:10px;text-transform:uppercase;color:var(--m);letter-spacing:.06em}
.w{overflow-x:auto}

/* Modal */
.ov{
  position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;z-index:40;
}
.fc{
  width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  background:linear-gradient(165deg,hsl(var(--h) 46% 24%),#0b1410);
  color:#fff;border-radius:22px 22px 0 0;border-top:1px solid rgba(255,255,255,.15);
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  animation:up .2s ease;
}
.fc.light-m{background:var(--c);color:var(--t);border-top:1px solid var(--b)}
@keyframes up{from{transform:translateY(30px);opacity:0}}

/* Player Card Mini Attribute Bars */
.pstat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.pstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:7px 9px}
.pstat .br{height:5px;background:rgba(255,255,255,.18);margin-top:4px}

/* Bottom Navigation */
nav{
  position:fixed;bottom:0;left:0;right:0;display:flex;
  background:var(--c);border-top:1px solid var(--b);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;
  box-shadow:0 -4px 18px rgba(0,0,0,.08);
}
nav button{
  flex:1;flex-direction:column;gap:3px;margin:0;padding:8px 4px 7px;min-height:52px;
  background:none;color:var(--m);border-radius:0;font-size:11px;font-weight:700;
  position:relative;
}
nav button.on{color:var(--a)}
nav button.on::before{
  content:"";position:absolute;top:0;left:22%;right:22%;height:3px;
  background:var(--a);border-radius:0 0 4px 4px;
}
</style>

function ico(name,size=15){

/* ==================== WEB AUDIO SFX + HAPTIC VIBRATION ==================== */
const SFX={
  ctx:null,
  muted:false,
  init(){
    try{this.muted=localStorage.getItem('mfc_mute')==='1'}catch(e){}
  },
  unlock(){
    if(this.ctx)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){this.ctx=new AC();if(this.ctx.state==='suspended')this.ctx.resume()}
    }catch(e){}
  },
  toggle(){
    this.unlock();
    this.muted=!this.muted;
    try{localStorage.setItem('mfc_mute',this.muted?'1':'0')}catch(e){}
    document.querySelectorAll('[data-mute-btn]').forEach(el=>{
      el.innerHTML=ico(this.muted?'volOff':'volOn',16);
      el.title=this.muted?'Sesi Aç':'Sesi Kapat';
    });
    if(!this.muted)this.tap();
  },
  vib(pat){
    if(this.muted)return;
    try{if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate(pat)}catch(e){}
  },
  tone(freq,dur,type='sine',vol=0.12,delay=0,endFreq=null){
    if(this.muted)return;
    this.unlock();
    if(!this.ctx)return;
    try{
      const t=this.ctx.currentTime+delay;
      const o=this.ctx.createOscillator();
      const g=this.ctx.createGain();
      o.type=type;
      o.frequency.setValueAtTime(freq,t);
      if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,t+dur);
      g.gain.setValueAtTime(0.001,t);
      g.gain.linearRampToValueAtTime(vol,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.connect(g);g.connect(this.ctx.destination);
      o.start(t);o.stop(t+dur+0.02);
    }catch(e){}
  },
  tap(){this.tone(620,0.045,'triangle',0.07)},
  whistle(){this.tone(2650,0.16,'sine',0.09,0,2850);this.tone(2750,0.22,'sine',0.09,0.2,2500)},
  goal(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,0.22,'triangle',0.14,i*0.07));this.vib([80,40,120])},
  concede(){this.tone(150,0.35,'sawtooth',0.12,0,62);this.vib([130])},
  save(){this.tone(180,0.09,'square',0.11,0,90);this.tone(660,0.16,'sine',0.1,0.06);this.vib([55])},
  card(){this.tone(920,0.09,'square',0.1,0);this.tone(720,0.14,'square',0.1,0.11);this.vib([70,40,70])},
  ok(){this.tone(587.33,0.1,'triangle',0.11,0);this.tone(880,0.18,'triangle',0.12,0.08);this.vib([40,30,60])},
  bad(){this.tone(240,0.18,'sawtooth',0.11,0,130);this.vib([90])}
};
SFX.init();
document.addEventListener('pointerdown',()=>SFX.unlock(),{once:true,passive:true});

function muteBtnHTML(){
  return`<button class="ic" data-mute-btn onclick="SFX.toggle()" title="${SFX.muted?'Sesi Aç':'Sesi Kapat'}">${ico(SFX.muted?'volOff':'volOn',16)}</button>`;
}

function clubColors(cid){
  if(isEuroId(cid))return getEuroClub(cid).col;
  const pal=(DB&&DB.preset==='2627')?CLUB_PAL_2627:CLUB_PAL;
  if(pal[cid])return pal[cid];
  const h=(cid*47+15)%360;
  return [`hsl(${h},62%,38%)`,`hsl(${(h+45)%360},75%,58%)`];
}
const clubHue=i=>(i*31+15)%360;
const clubCol=i=>{
  if(isEuroId(i))return getEuroClub(i).col[0];
  const pal=(DB&&DB.preset==='2627')?CLUB_PAL_2627:CLUB_PAL;
  return pal[i]?pal[i][0]:`hsl(${clubHue(i)},62%,42%)`;
};
const clubCode=i=>CN(i).replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g,'').slice(0,3).toUpperCase();

let _crestUid=0;
function clubCrestSVG(cid,size=34){
  const [c1,c2]=clubColors(cid);
  const code=E(clubCode(cid));
  const pat=Math.abs(cid)%6;
  const uid='cr_'+cid+'_'+(++_crestUid);
  const gid='shg_'+cid+'_'+_crestUid;
  let shape='';
  if(pat===0){
    shape=`<rect x="0" y="0" width="40" height="44" fill="${c1}"/><rect x="8" y="0" width="6" height="44" fill="${c2}"/><rect x="20" y="0" width="6" height="44" fill="${c2}"/><rect x="32" y="0" width="6" height="44" fill="${c2}"/>`;
  }else if(pat===1){
    shape=`<rect x="0" y="0" width="40" height="44" fill="${c1}"/><polygon points="-4,34 34,-4 44,6 6,44" fill="${c2}"/>`;
  }else if(pat===2){
    shape=`<rect x="0" y="0" width="20" height="44" fill="${c1}"/><rect x="20" y="0" width="20" height="44" fill="${c2}"/>`;
  }else if(pat===3){
    shape=`<rect x="0" y="0" width="40" height="44" fill="${c1}"/><polygon points="0,10 20,26 40,10 40,19 20,35 0,19" fill="${c2}"/>`;
  }else if(pat===4){
    shape=`<rect x="0" y="0" width="40" height="44" fill="${c1}"/><rect x="0" y="10" width="40" height="7" fill="${c2}"/><rect x="0" y="25" width="40" height="7" fill="${c2}"/>`;
  }else{
    shape=`<rect x="0" y="0" width="20" height="22" fill="${c1}"/><rect x="20" y="0" width="20" height="22" fill="${c2}"/><rect x="0" y="22" width="20" height="22" fill="${c2}"/><rect x="20" y="22" width="20" height="22" fill="${c1}"/>`;
  }
  const shield='M20 2 L36 7 V20 C36 31 29 38.5 20 42 C11 38.5 4 31 4 20 V7 Z';
  return `<svg width="${size}" height="${Math.round(size*1.1)}" viewBox="0 0 40 44" style="flex-shrink:0;display:block" aria-hidden="true">
    <defs>
      <clipPath id="${uid}"><path d="${shield}"/></clipPath>
      <linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
        <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity=".3"/>
      </linearGradient>
    </defs>
    <g clip-path="url(#${uid})">${shape}<rect x="0" y="0" width="40" height="44" fill="url(#${gid})"/></g>
    <path d="${shield}" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="1.8"/>
    <rect x="5.5" y="15.5" width="29" height="12.5" rx="3" fill="rgba(8,14,11,.8)"/>
    <text x="20" y="24.5" text-anchor="middle" fill="#fff" font-size="8.6" font-weight="900" font-family="-apple-system,sans-serif" letter-spacing=".4">${code}</text>
  </svg>`;
}

function jerseySVG(cid,num,isSel,isGK){
  const [raw1,raw2]=clubColors(cid);
  const c1=isSel?'#ffffff':(isGK?'#f59e0b':raw1);
  const c2=isSel?'#111827':(isGK?'#111827':raw2);
  const numCol=isSel?'#111827':(isGK?'#111827':'#ffffff');
  return `<svg viewBox="0 0 36 36" width="34" height="34" style="display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))" aria-hidden="true">
    <path d="M11 4 L4 9 L7.5 15 L10.5 13.5 V31 H25.5 V13.5 L28.5 15 L32 9 L25 4 C23.5 7 21 8.2 18 8.2 C15 8.2 12.5 7 11 4 Z" fill="${c1}" stroke="#0a120d" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M11.4 4.4 C13 7.5 15.2 8.8 18 8.8 C20.8 8.8 23 7.5 24.6 4.4" fill="none" stroke="${c2}" stroke-width="2.1"/>

function addRaf(fn){const id=requestAnimationFrame(fn);TIMERS.raf.push(id);return id}

  const box=$('toast-box');if(!box)return;

  el.className='toast '+(type||'');
  const ic=type==='ok'?'check':type==='bad'?'alert':type==='warn'?'alert':'news';
  el.innerHTML=`${ico(ic,15)}<span>${E(msg)}</span>`;
  box.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .25s';setTimeout(()=>el.remove(),260)},ms);
}

function assignNo(p,idxInClub){
  if(p===0)return idxInClub===0?1:12+idxInClub;
  if(p===1)return [2,3,4,5,13,15,22,26][idxInClub%8];
  if(p===2)return [6,8,10,14,16,18,20,24][idxInClub%8];
  return [7,9,11,17,19,21,23,29][idxInClub%8];
}

function calcPot(c,o,a,tp){
  const baseS=(DB&&DB.clubs[c])?(DB.clubs[c].baseS||DB.clubs[c].s||65):65;
  const tierTop=baseS>=75?R(78,90):baseS>=65?R(70,83):R(64,77);
  const youngRoom=a<=24?o+R(3,11):o+R(0,3);
  const raw=Math.max(o,Math.round((tierTop*0.65+youngRoom*0.35)+(tp===4?5:0)));
  return C(raw,64,92);
}

function mk(n,c,p,o,a,forcedTp,forcedPot){
  const cnt=DB.pl.filter(q=>q.c===c&&q.p===p).length;
  const tp=forcedTp!==undefined?forcedTp:R(0,4);
  const ovr=C(o,38,95);
  const pot=forcedPot!==undefined?C(forcedPot,64,92):calcPot(c,ovr,a,tp);
  const x={
    id:DB.pl.length,n,c,p,o:ovr,a,pot,
    k:100,m:62,f:50,i:0,sus:0,ct:R(1,3),tp,
    xp:0,g:0,bnStrk:0,prom:0,no:assignNo(p,cnt)
  };
  DB.pl.push(x);return x;
}

function regenPlayer(x){
  const baseS=(DB&&DB.clubs[x.c])?(DB.clubs[x.c].baseS||DB.clubs[x.c].s||65):65;
  x.a=R(18,20);
  x.n=nm();

  if(baseS>=75){
    x.o=R(60,74);
    x.pot=C(R(78,90)+(x.tp===4?3:0),76,92);
  }else if(baseS>=65){
    x.o=R(55,68);

  }else{
    x.o=R(50,62);

function wg(x){
  const base=Math.round((x.o*x.o)/1550);
  const star=x.o>=76?Math.round((x.o-75)*0.65):0;
  const mega=x.o>=83?Math.round((x.o-82)*0.90):0;
  return Math.max(1,base+star+mega);
}
function val(x){
  const inf=infFactor();
  const core=Math.max(1,Math.pow(Math.max(1,x.o-47),2)/40);
  const elite=x.o>=78?(x.o-77)*3.2:0;
  const ageMod=x.a<=22?1.2:x.a>=31?0.72:1;
  return Math.max(1,Math.round((core+elite)*ageMod*inf));
}
function buyPrice(x){
  let p=val(x)*(1-0.04*G.sk[2]);
  if(G.med<30)p*=1.20;
  if(domRep()==='yth'&&x.a<=23)p*=0.90;
  return Math.max(1,Math.round(p));
}

  if(Math.abs(x.p-slot.pos)===1)return 0.88;

    const hasGK=avail.some(x=>x.p===0);
    const pos=hasGK?P([1,2,3]):0;
    mk(nm(),cid,pos,R(44,50),R(17,18),4,R(64,74));

    const msg=`Altyapıdan Acil Takviye: Kadro 11'in altına düştüğü için ${added} genç oyuncu (17-18 yaş, bedelsiz) A takıma alındı.`;

function autoSlots(c,f,restTired=false){
  const slots=SLOTS[f]||SLOTS['4-3-3'];
  const pool=hl(c);
  const chosen=new Array(11).fill(null);
  const used=new Set();

  const scoreFor=(x,slot)=>{
    let sc=eff(x)*slotFit(x,slot);
    if(restTired&&x.k<62)sc*=0.52;
    return sc;
  };

  const order=[...slots.keys()].sort((a,b)=>(slots[a].pos===0?-1:slots[b].pos===0?1:0));
  for(const idx of order){
    const slot=slots[idx];
    const cand=pool.filter(x=>!used.has(x.id)&&x.p===slot.pos)
      .sort((a,b)=>scoreFor(b,slot)-scoreFor(a,slot))[0];
    if(cand){chosen[idx]=cand.id;used.add(cand.id)}
  }
  for(let idx=0;idx<11;idx++){
    if(chosen[idx]!==null)continue;
    const slot=slots[idx];
    const cand=pool.filter(x=>!used.has(x.id))
      .sort((a,b)=>scoreFor(b,slot)-scoreFor(a,slot))[0];
    if(cand){chosen[idx]=cand.id;used.add(cand.id)}
  }
  return chosen.filter(id=>id!==null);
}

function auto(c,f){
  return autoSlots(c,f,false).map(id=>DB.pl[id]).filter(Boolean);
}

function fixXI(silent=false){
  ensureMinSquad(G.cid,silent);
  const slots=SLOTS[G.f]||SLOTS['4-3-3'];
  const used=new Set();
  const next=new Array(11).fill(null);
  for(let i=0;i<11;i++){
    const id=G.xi[i];
    const x=id!==undefined?DB.pl[id]:null;
    if(x&&x.c===G.cid&&isAvail(x)&&!used.has(x.id)){
      next[i]=x.id;used.add(x.id);
    }
  }
  const pool=hl(G.cid);
  for(let i=0;i<11;i++){
    if(next[i]!==null)continue;
    const slot=slots[i];
    const cand=pool.filter(x=>!used.has(x.id))
      .sort((a,b)=>eff(b)*slotFit(b,slot)-eff(a)*slotFit(a,slot))[0];
    if(cand){next[i]=cand.id;used.add(cand.id)}
  }
  G.xi=next.filter(id=>id!==null);
}

function tstr(c){
  if(isEuroId(c))return getEuroClub(c).s;
  if(c!==G.cid){
    const l=auto(c,'4-3-3');
    return l.reduce((s,x)=>s+eff(x),0)/11;
  }
  const slots=SLOTS[G.f]||SLOTS['4-3-3'];
  let t=0;
  for(let i=0;i<slots.length;i++){
    const x=DB.pl[G.xi[i]];
    if(x&&isAvail(x)){
      t+=eff(x)*slotFit(x,slots[i]);
    }
  }
  let base=(t/11)*(1+0.007*G.sk[0])+(G.campBonus?2:0);
  if(G.sq<35)base*=0.85;
  return base;
}

function fix(n){
  const ids=[...Array(n).keys()],w=[];
  for(let r=0;r<n-1;r++){
    const m=[];
    for(let i=0;i<n/2;i++){const a=ids[i],b=ids[n-1-i];m.push(r%2?[b,a]:[a,b])}
    w.push(m);ids.splice(1,0,ids.pop());
  }
  return w.concat(w.map(m=>m.map(([a,b])=>[b,a])));
}

const pts=t=>t.w*3+t.d-(t.pen||0);

const mkCal=()=>{

function skipEliminatedCupWeeks(){

function recordMatchStats(gf,ga,opName){

    st.wins++;st.winStreak++;

}

        const n=o.name||o.ad,c=o.club||o.kulup,ov=+(o.ovr||o.overall);
        if(n&&c&&ov)(by[c]=by[c]||[]).push({n,p:pm(o.pos||o.position),o:ov,a:+(o.age||o.yas)||24});
      });
      const cl=Object.entries(by).filter(([,v])=>v.length>=16)
        .map(([k,v])=>[k,v,v.map(x=>x.o).sort((a,b)=>b-a).slice(0,11).reduce((s,x)=>s+x,0)/11])
        .sort((a,b)=>b[2]-a[2]).slice(0,12);
      if(cl.length<12)throw 0;
      DB={
        preset:'custom',
        clubs:cl.map((c,i)=>{
          const bs=Math.round(c[2]),inf=defaultClubInfra(bs);
          return{id:i,name:c[0],s:bs,baseS:bs,fac:inf.fac.slice(),stf:inf.stf.slice(),tp:inf.tp};
        }),
        pl:[],
        src:'Özel kadro başarıyla içe aktarıldı.'
      };
      cl.forEach(([,v],i)=>v.forEach(x=>mk(x.n,i,x.p,x.o,x.a)));
    }catch(e){DB.src='Dosya okunamadı veya format eksik.'}
    menu();
  };
  r.readAsText(f);
}

    ffpApplied:0,campBonus:0,invCamp:0,invScout:0,scoutStarId:null,
    stats:defaultStats()
  };
  ensureEuroOps();
  const myPl=DB.pl.filter(x=>x.c===cid).sort((a,b)=>b.o-a.o);
  if(sc.id==='chaos'){
    let cnt=myPl.filter(x=>x.tp===1).length;
    for(const x of myPl){if(cnt>=3)break;if(x.tp!==1){x.tp=1;cnt++}}
  }else if(sc.id==='rising'){
    myPl.slice(0,6).forEach((x,i)=>{x.a=Math.min(x.a,R(19,23));if(i<2)x.tp=4});
  }
  G.obj=newObj();
  G.xi=autoSlots(cid,'4-3-3',false);
  G.cap=myPl[0]?myPl[0].id:null;
  genMkt();genYth();render();
}

  const xa=G.xi.indexOf(a),xb=G.xi.indexOf(id);

  if((xa>=0&&xb<0&&!isAvail(pB))||(xb>=0&&xa<0&&!isAvail(pA))){
    G.s1=null;
    const blocked=!isAvail(pB)?pB:pA;
    render();
    return mdl(blocked.id,blocked.i?'Bu oyuncu sakat olduğu için ilk 11\'e alınamaz.':'Bu oyuncu kırmızı kart cezalısı olduğu için bu hafta oynayamaz.');
  }

  if(xa>=0&&xb<0)G.xi[xa]=id;
  else if(xb>=0&&xa<0)G.xi[xb]=a;
  else if(xa>=0&&xb>=0){G.xi[xa]=id;G.xi[xb]=a}
  G.s1=null;render();
}

function setCaptain(id){
  const oldCap=G.cap;
  if(oldCap===id)return;
  G.cap=id;
  const oldP=oldCap!==null?DB.pl[oldCap]:null;
  const otherLeader=DB.pl.find(x=>x.c===G.cid&&x.id!==id&&x.tp===0);
  if((oldP&&oldP.c===G.cid)||otherLeader){
    if(!G.later.some(l=>l.id==='cap_revolt')){
      G.later.push({id:'cap_revolt',w:1,pid:(oldP&&oldP.c===G.cid)?oldP.id:otherLeader.id});
    }
  }
  mdl(id,'Yeni kaptan atandı. Soyunma odasındaki liderler bu kararı konuşuyor.');
}

function tkp(id,a){
  const x=DB.pl[id];G.tk=1;SFX.tap();
  let msg='';
  if(a===0){
    addRep('ply',1);
    if(x.tp===1){x.m=C(x.m+10,0,100);x.f=C(x.f+4,0,100);msg='Bencil karakteri övgüye bayıldı (Moral +10, Form +4).'}
    else if(x.tp===0){x.m=C(x.m+6,0,100);G.sq=C(G.sq+2,0,100);msg='Lider oyuncu bu desteği tüm takıma yaydı (Moral +6, Soyunma Odası +2).'}
    else{x.m=C(x.m+7,0,100);x.f=C(x.f+5,0,100);msg='Oyuncu motive oldu (Moral +7, Form +5).'}
  }else if(a===1){
    addRep('auth',1);
    if(x.tp===1){x.m=C(x.m-9,0,100);G.sq=C(G.sq-2,0,100);msg='Bencil yıldız sert uyarına ters tepki verdi (Moral -9, Soyunma Odası -2).'}
    else if(x.tp===2){x.m=C(x.m+3,0,100);x.f=C(x.f+7,0,100);msg='Çalışkan karakteri hırslandı (Moral +3, Form +7).'}
    else{x.m=C(x.m-3,0,100);x.f=C(x.f+4,0,100);G.sq=C(G.sq+1,0,100);msg='Oyuncu mesajı aldı (Moral -3, Form +4, Soyunma Odası +1).'}
  }else if(a===2){
    x.prom=2;addRep('ply',1);
    if(x.tp===4){x.m=C(x.m+12,0,100);addRep('yth',1);msg='Genç yetenek ilk 11 sözüyle motive oldu. Önümüzdeki 2 maçta oynatmazsan güvenini kaybedersin.'}
    else{x.m=C(x.m+9,0,100);msg='İlk 11 sözü verdin (Moral +9). Sözünü tutmazsan basına sızdırabilir.'}
  }else{
    const gain=x.tp===2?7:x.tp===4?6:3;
    if(x.tp===4)addRep('yth',1);
    x.xp+=gain;
    let lvl='';
    if(x.xp>=10){x.xp-=10;x.o=Math.min(95,x.o+1);lvl=' OVR +1 yükseldi!'}
    if(x.tp===3){x.k=Math.max(25,x.k-10);msg=`Sakatlığa meyilli olduğu için fazla yoruldu (-10% Kond, +${gain} XP).${lvl}`}
    else{x.k=Math.max(30,x.k-5);msg=`Verimli özel antrenman (+${gain} XP, -5% Kond).${lvl}`}
  }
  save();mdl(id,msg);
}

/* Player + Cash Swap in bidS */
function swapBonusFor(targetCid,swapId){
  if(swapId===''||swapId===null||swapId===undefined)return{val:0,bonus:0,p:null};
  const sp=DB.pl[+swapId];
  if(!sp||sp.c!==G.cid)return{val:0,bonus:0,p:null};
  const sVal=Math.max(1,Math.round(val(sp)*0.85));
  const oppPl=DB.pl.filter(q=>q.c===targetCid);
  const posCnt=oppPl.filter(q=>q.p===sp.p).length;
  const needLimit=sp.p===0?2:4;
  const oppS=(DB.clubs[targetCid]&&DB.clubs[targetCid].s)||65;
  let bonus=0;
  if(posCnt<needLimit)bonus+=8;
  if(sp.o>=oppS-3)bonus+=6;
  else if(sp.o<oppS-10)bonus-=8;
  return{val:sVal,bonus,p:sp};
}

function bidS(id){
  if(isDebtLocked()){toast('Borç kilidi (-15 M) nedeniyle transfer teklifi yapılamaz.','bad');return}
  SFX.tap();
  const x=DB.pl[id],v=buyPrice(x);
  const myPl=DB.pl.filter(q=>q.c===G.cid).sort((a,b)=>b.o-a.o);
  const canSwap=myPl.length>13;
  S(`<div class="c">

      <span class="lbl" style="margin-top:8px">${ico('swap',12)} Takas Oyuncusu Ekle (Opsiyonel · %85 Değer Düşülür)</span>
      <select id="swap-pl" onchange="bu(${v},${x.c})">
        <option value="">Takas Yok (Sadece Nakit)</option>
        ${myPl.map(q=>`<option value="${q.id}">${E(q.n)} (${PN[q.p]}, OVR ${q.o}) → -${Math.max(1,Math.round(val(q)*0.85))} M</option>`).join('')}
      </select>
    `:`<p class="m">Kadro 13 kişide olduğu için takas kapalı.</p>`}
    <input type="range" id="bs" min="70" max="140" step="5" value="100" oninput="bu(${v},${x.c})">
    <div class="big" id="bl2" style="text-align:center;margin:8px 0"></div>

  </div>`,true);
  bu(v,x.c);
}
function bu(v,targetCid){
  const p=+$('bs').value,gross=Math.round(v*p/100);
  const selEl=$('swap-pl');
  const swInfo=selEl?swapBonusFor(targetCid,selEl.value):{val:0,bonus:0};
  const net=Math.max(0,gross-swInfo.val);
  const acc=pct(p,swInfo.bonus);
  $('bl2').textContent=`${net} M${swInfo.val?` (+Takas -${swInfo.val}M)`:''} · Kabul %${acc}`;
  const btn=$('bid-go');
  if(btn){
    const poor=G.cash<net;
    btn.disabled=poor;
    btn.textContent=poor?'Bütçe Yetersiz':`Teklif Gönder (${net} M${swInfo.val?' + Takas':''})`;
  }
}
function bid2(id,v){
  const target=DB.pl[id],targetCid=target.c;
  const p=+$('bs').value,gross=Math.round(v*p/100);
  const selEl=$('swap-pl');
  const swInfo=selEl?swapBonusFor(targetCid,selEl.value):{val:0,bonus:0,p:null};
  const net=Math.max(0,gross-swInfo.val);
  if(G.cash<net){toast('Bütçe yetersiz.','bad');return}
  G.mkt=G.mkt.filter(i=>i!==id);
  if(G.scoutStarId===id)G.scoutStarId=null;
  if(Math.random()*100<pct(p,swInfo.bonus)){
    SFX.ok();
    G.cash-=net;target.c=G.cid;
    if(swInfo.p){
      swInfo.p.c=targetCid;
      if(G.cap===swInfo.p.id)G.cap=null;
      fixXI(true);
    }
    if(target.a<=23)addRep('yth',1);
    toast(`${target.n} ${net} M${swInfo.p?` + ${swInfo.p.n} takasıyla`:''} kadroya katıldı!`,'ok');
    render();
  }else{
    SFX.bad();
    S(`<div class="c"><span class="lbl">Transfer Reddedildi</span><p>Kulüp teklifini reddetti ve oyuncuyu pazardan çekti.</p><button onclick="render()">Devam</button></div>`,true);
  }
}

function simPenShootout(){
  let my=0,op=0;
  for(let i=0;i<5;i++){
    if(Math.random()<0.76)my++;
    if(my>op+(5-i-1)||op>my+(5-i))break;
    if(Math.random()<0.76)op++;
    if(op>my+(5-i-1)||my>op+(5-i-1))break;
  }
  while(my===op){
    const a=Math.random()<0.74?1:0,b=Math.random()<0.74?1:0;
    my+=a;op+=b;
  }
  return{my,op,won:my>op};
}

function runQuickSim(maxWeeks){
  clearTimers();mdx();
  if(G.spon===null)G.spon=1;

  const startCash=G.cash;
  let played=0,wCnt=0,dCnt=0,lCnt=0,injCnt=0,redCnt=0,crisisCnt=0;
  const highlights=[],incidents=[];
  let stopReason=null;

  for(let step=0;step<maxWeeks;step++){
    skipEliminatedCupWeeks();
    if(G.wk>=G.cal.length)break;

    ensureMinSquad(G.cid,true);
    autoPickBestXI(true);
    const n=nx();
    const os=(n.op*3+G.wk+G.season)%4;
    if(G.asstStyle)G.sty=counterStyle(os);

    const homeBonus=(n.home&&G.fans>=35&&!hm('prot'))?3:-1;
    const d=tstr(G.cid)-tstr(n.op)+homeBonus;
    const ad=adv(G.sty,os);
    const advMult=G.scen==='tactician'?0.16:0.08;
    let lf=C(1.42*Math.exp(d/22)*(1+advMult*ad),0.22,4.6);
    let la=C(1.16*Math.exp(-d/22)*(1-advMult*ad),0.20,4.6);
    if(n.home&&G.fans>85){lf*=1.10;la*=0.88}
    if(hm('split'))lf*=0.90;
    if(hm('hype'))lf*=1.10;
    if(hm('prot')&&n.home){lf*=0.92;la*=1.06}
    if(G.trn===0)lf+=0.10;
    if(G.trn===1)la=Math.max(0.15,la-0.10);
    if(G.trn===2)DB.pl.forEach(x=>{if(x.c===G.cid)x.k=Math.min(100,x.k+6)});

    let simRedPlayer=null;
    const redChance=hm('disc')?0.02:(0.045+G.agg*0.025);
    if(Math.random()<redChance&&G.xi.length){
      simRedPlayer=DB.pl[P(G.xi)];
      lf*=0.85;la*=1.15;
      redCnt++;
      if(simRedPlayer)incidents.push(`Kırmızı Kart: ${simRedPlayer.n} (1 maç ceza)`);
    }

    const gf=poi(lf),ga=poi(la);
    const r=gf>ga?1:gf<ga?-1:0;
    const pen=(n.t!=='l'&&r===0)?simPenShootout():null;
    const penTag=pen?` (Pen: ${pen.my}-${pen.op})`:'';
    const cupOk=r>0||(pen&&pen.won);
    played++;
    if(r>0)wCnt++;else if(r===0)dCnt++;else lCnt++;
    recordMatchStats(gf,ga,CN(n.op));

    const xiPl=G.xi.map(id=>DB.pl[id]).filter(Boolean);
    const attPool=xiPl.filter(x=>x.p>=2);
    for(let g=0;g<gf;g++){
      const z=P(attPool.length?attPool:xiPl);
      if(z)z.g=(z.g||0)+1;
    }

    const prevTb=JSON.stringify(G.tb);
    if(n.t==='l'){
      G.fx[n.r].forEach(([h,a])=>{
        if(h===G.cid||a===G.cid)res(h,a,h===G.cid?gf:ga,h===G.cid?ga:gf);
        else{const[x,y]=sim(h,a);res(h,a,x,y)}
      });
      const old=JSON.parse(prevTb);
      G.fx[n.r].forEach(([h,a])=>{
        if(h!==G.cid&&a!==G.cid){
          const x=G.tb[h].gf-old[h].gf,y=G.tb[a].gf-old[a].gf;
          [[h,x],[a,y]].forEach(([cid,gl])=>{
            for(let i=0;i<gl;i++){
              const fs=DB.pl.filter(q=>q.c===cid&&q.p>=2);
              if(fs.length){const z=P(fs);z.g=(z.g||0)+1}
            }
          });
        }
      });
      highlights.push(`H${n.r+1} Lig: ${CN(G.cid)} ${gf}-${ga} ${CN(n.op)}`);
    }else if(n.t==='e'){
      if(cupOk){
        G.eurR++;G.xp+=20;
        const mult=ecoInf();
        if(G.eurR===3){
          G.eurWon=1;G.stats.euroCups++;G.cash+=Math.round(35*mult);
          G.fans=C(G.fans+15,0,100);G.board=C(G.board+15,0,100);G.med=C(G.med+12,0,100);G.xp+=60;
          highlights.push(`AVRUPA ŞAMPİYONU: ${CN(G.cid)} ${gf}-${ga}${penTag} ${CN(n.op)} (+${Math.round(35*mult)} M)`);
        }else{
          const rew=Math.round((G.eurR===1?8:12)*mult);G.cash+=rew;
          highlights.push(`Avrupa Kupası Tur Geçildi: ${CN(G.cid)} ${gf}-${ga}${penTag} ${CN(n.op)} (+${rew} M)`);
        }
      }else{
        G.euro=0;
        highlights.push(`Avrupa'ya Veda: ${CN(G.cid)} ${gf}-${ga}${penTag} ${CN(n.op)}`);
      }
    }else{
      if(cupOk){
        G.cr++;G.xp+=15;
        if(G.cr===3){G.stats.natCups++;G.fans=C(G.fans+12,0,100);G.xp+=40;highlights.push(`KUPA ŞAMPİYONU: ${CN(G.cid)} ${gf}-${ga}${penTag} ${CN(n.op)}`)}
        else highlights.push(`Kupa Turu Geçildi: ${CN(G.cid)} ${gf}-${ga}${penTag} ${CN(n.op)}`);
      }else{
        G.cup=0;
        highlights.push(`Kupadan Elendin: ${CN(G.cid)} ${gf}-${ga}${penTag} ${CN(n.op)}`);
      }
    }

    const cp=G.cap!==null&&G.xi.includes(G.cap);
    G.xp+=r>0?10:r===0?3:0;
    while(G.xp>=30){G.xp-=30;G.sp++}
    G.strk=r<0?G.strk+1:0;
    G.board=C(G.board+r*3,0,100);
    G.fans=C(G.fans+r*3,0,100);
    G.sq=C(G.sq+r*2+(cp&&r<0?1:0),0,100);

    if(n.home){
      let base=(3.4+G.fac[3]*1.4)*Math.min(1.5,ecoInf());
      let rev=base*(1+[-0.15,0,0.28][G.tp]+(fill()-70)/200);
      if(G.fans<35)rev*=0.65;
      if(hm('prot')){rev*=0.5;const pm=G.mods.find(m=>m.id==='prot');if(pm)pm.w--}
      G.cash+=Math.max(0.5,rev);
      if(G.tp===0)G.fans=C(G.fans+1,0,100);
      if(G.tp===2&&fill()<60)G.fans=C(G.fans-1,0,100);
    }
    if(r>0&&G.spon===1)G.cash+=4.5*ecoInf();

    if(r>0&&Math.random()<0.5)G.med=C(G.med+1,0,100);
    else if(r<0){G.board=C(G.board-1,0,100);if(Math.random()<0.5)G.med=C(G.med-1,0,100)}

    const dueIdx=G.later.findIndex(l=>l.w<=0);
    if(dueIdx>=0){
      const it=G.later.splice(dueIdx,1)[0];
      crisisCnt++;
      G.sq=C(G.sq-1,0,100);G.med=C(G.med-1,0,100);
      incidents.push(`Kriz orta yolla çözüldü (${it.id.replace('_',' ')})`);
    }else if(Math.random()<0.14){
      crisisCnt++;
      const dSq=P([-2,-1,1,2]);
      G.sq=C(G.sq+dSq,0,100);
      incidents.push(dSq<0?'Soyunma odasında kısa süreli gerginlik yaşandı.':'Kulüp içi toplantı moralleri dengeledi.');
    }

    const injRed=G.fac[2]*0.01+G.stf[2]*0.012;
    const playedIds=new Set(G.xi);
    DB.pl.filter(x=>x.c===G.cid).forEach(x=>{
      if(playedIds.has(x.id)){
        x.bnStrk=0;
        if(x.prom>0)x.prom--;
        const loss=R(15,20)+G.agg*2;
        x.k=Math.max(12,Math.round(x.k-loss));
        x.m=C(x.m+r*(cp?3:4),0,100);
        x.f=C(x.f+r*4,0,100);
        const risk=(x.k<52?0.07+0.03*G.agg:x.k<68?0.025+0.015*G.agg:0.012)-injRed+(x.tp===3?0.035:0);
        if(Math.random()<Math.max(0.004,risk)){
          x.i=R(1,3);injCnt++;
          incidents.push(`Sakatlık: ${x.n} (${x.i} hafta)`);
        }
      }else{
        if(x.sus>0)x.sus--;
        if(!x.i)x.bnStrk=(x.bnStrk||0)+1;
        x.m=C(x.m-(x.tp===1?2:1),0,100);
        if(x.prom>0&&!x.i){x.prom=0;x.m=C(x.m-12,0,100)}
      }
    });
    if(simRedPlayer)simRedPlayer.sus=1;

    if(G.ult){
      const earned=r>0?3:r===0?1:0;
      G.ult.pts+=earned;G.ult.left--;
      if(G.ult.pts>=G.ult.need){
        G.ult=null;G.board=C(G.board+14,0,100);
        highlights.push('Yönetim ültimatomu başarıyla aşıldı (+14 Yönetim).');
      }else if(G.ult.left<=0){
        return fired(`Hızlı simülasyonda yönetim ültimatomu başarısız oldu (${G.ult.pts}/${G.ult.need} puan). Görevine son verildi.`);
      }
    }

    const sc=scenCfg();
    if(G.sq<10)return fired('Soyunma odası isyan etti! Yönetim görevine son verdi.');
    if(G.board<sc.fireTh&&!G.ult)return fired('Yönetim güveni kritik eşiğin altına indi. Görevden alındın.');
    if(G.board<sc.ultTh&&!G.ult){
      G.ult={left:3,pts:0,need:6};
      advanceWeekInternals(playedIds,true);
      stopReason='ultimatum';
      break;
    }

    advanceWeekInternals(playedIds,true);
    if(G.wk>=G.cal.length)break;
  }

  save();
  const curRank=rank().indexOf(G.cid)+1;
  const cashDiff=G.cash-startCash;
  const topClubScorer=DB.pl.filter(x=>x.c===G.cid).sort((a,b)=>(b.g||0)-(a.g||0))[0];
  const cupTxt=G.cr===3?'Kupa Şampiyonu':G.cup?`${G.cr}/3 Tur Geçildi`:'Elendi';
  const seasonDone=G.wk>=G.cal.length;

  S(`
    <div class="ed-card">
      <div class="ed-accent ${stopReason==='ultimatum'?'':'sim'}"></div>
      <div class="ed-mast">
        <strong>SPOR MANŞET</strong>
        <span>SEZON ${G.season} · SİMÜLASYON RAPORU</span>
      </div>
      <div class="ed-body">
        <div class="ed-kicker ${stopReason==='ultimatum'?'':'sim'}">
          ${stopReason==='ultimatum'?`${ico('alert',12)} ACİL DURAKLATMA · YÖNETİM ÜLTİMATOMU`:`${ico('fast',12)} HIZLI KARİYER ÖZETİ`}
        </div>
        <div class="ed-hl">
          ${stopReason==='ultimatum'
            ?'Yönetim Kurulu Acil Toplandı: 3 Maçta 6 Puan Şartı!'
            :`${played} Maç Tamamlandı · ${wCnt}G ${dCnt}B ${lCnt}M`}
        </div>

        <div class="g2" style="margin:10px 0">
          <div class="c2" style="margin:0"><span class="lbl">Güncel Lig Sırası</span><div class="big">${curRank}. Sıra</div></div>
          <div class="c2" style="margin:0"><span class="lbl">Kasa Değişimi</span><div class="big" style="color:${cashDiff>=0?'var(--ok)':'var(--bad)'}">${cashDiff>=0?'+':''}${cashDiff.toFixed(1)} M</div></div>
          <div class="c2" style="margin:0"><span class="lbl">En Golcü Oyuncu</span><div style="font-weight:800;font-size:14px">${topClubScorer?`${E(topClubScorer.n)} (${topClubScorer.g||0})`:'-'}</div></div>
          <div class="c2" style="margin:0"><span class="lbl">Kupa / Avrupa</span><div style="font-weight:800;font-size:13px">${cupTxt}${G.euro?` · Avr ${G.eurR}/3`:''}</div></div>
        </div>

        <div class="c2" style="margin:8px 0">
          <span class="lbl">${ico('alert',12)} Sakatlık / Ceza / Kriz Özeti</span>
          <div class="row" style="flex-wrap:wrap;margin-bottom:4px">
            <span class="pill ${injCnt?'neg':'pos'}">Sakatlık: ${injCnt}</span>
            <span class="pill ${redCnt?'neg':'pos'}">Kırmızı Kart: ${redCnt}</span>
            <span class="pill ${crisisCnt?'neu':'pos'}">Kriz/Olay: ${crisisCnt}</span>
          </div>
          ${incidents.slice(-5).map(s=>`<div class="m" style="padding:2px 0">• ${E(s)}</div>`).join('')||'<div class="m">Önemli bir disiplin veya sakatlık krizi yaşanmadı.</div>'}
        </div>

        <span class="lbl" style="margin-top:8px">Öne Çıkan Sonuçlar</span>
        <div class="c2" style="max-height:140px;overflow-y:auto">
          ${highlights.slice(-8).reverse().map(h=>`<div class="m" style="padding:3px 0;border-bottom:1px solid var(--b)">${E(h)}</div>`).join('')||'<div class="m">Maç oynanmadı.</div>'}
        </div>

        <button style="margin-top:10px" onclick="${seasonDone?'endSeason':'render'}()">
          ${ico('play',14)} ${seasonDone?'Sezon Sonu Raporuna Geç':'Kariyere Devam Et'}
        </button>
      </div>
    </div>
  `);
}

function advanceWeekInternals(playedIds,silent=false){
  G.mods.forEach(m=>{if(m.id!=='prot')m.w--});
  if(hm('media'))G.fans=C(G.fans+1,0,100);
  if(hm('unrest'))G.sq=C(G.sq-2,0,100);
  G.mods=G.mods.filter(m=>m.w>0);
  G.later.forEach(l=>l.w--);

  const inc=weeklyBaseIncome();
  const exp=wageBill()+staffUpkeep()+facUpkeep();
  G.cash+=inc-exp;

  if(G.cash<-15){
    G.board=C(G.board-3,0,100);
  }
  if(G.cash<-30&&!G.ffpApplied){
    G.ffpApplied=1;
    G.tb[G.cid].pen=(G.tb[G.cid].pen||0)+3;
    const msg='Finansal Fair Play Cezası: Kasa -30 M altına düştüğü için -3 Lig Puanı kesildi!';
    G.news=[msg,...(G.news||[])].slice(0,5);
    if(!silent)toast(msg,'bad',4200);
  }

  const recBase=14+G.fac[0]*1.5+G.stf[0]*1.5+(G.trn===2?7:0);
  DB.pl.filter(x=>x.c===G.cid).forEach(x=>{
    if(x.i)x.i--;
    const rested=playedIds&&!playedIds.has(x.id)?6:0;
    x.k=Math.min(100,Math.round(x.k+recBase+rested));
  });
  fixXI(silent);

  G.wk++;G.inM=0;G.tk=0;G.ins=-1;G.mktRef=0;
  skipEliminatedCupWeeks();
  const curIt=G.cal[G.wk];
  if(curIt&&curIt[0]==='l'&&curIt[1]===11)genMkt();
}

/* ==================== PRE-MATCH DERBY DUEL & LIVE MATCH ENGINE ==================== */
function preMatchCheck(){
  ensureMinSquad(G.cid,false);
  if(G.asstAuto)autoPickBestXI(true);
  else fixXI(false);
  const n=nx();
  const os=(n.op*3+G.wk+G.season)%4;
  if(G.asstStyle)G.sty=counterStyle(os);

  const isTopRival=n.t==='l'&&(rank().indexOf(n.op)<4||DB.clubs[n.op].s>=75);
  if(isTopRival&&Math.random()<0.55){
    G.derby={op:n.op,stance:0};
    S(`
      <div class="ed-card">
        <div class="ed-accent derby"></div>
        <div class="ed-mast">
          <strong>SPOR MANŞET</strong>
          <span>HAFTA ${G.wk+1} · DERBİ ÖZEL</span>
        </div>
        <div class="ed-body">
          <div class="ed-kicker derby">${ico('flame',12)} SÖZ DÜELLOSU</div>
          <div class="ed-hl">${E(CN(n.op))} Teknik Direktörü Maç Öncesi Meydan Okudu</div>
          <div class="ed-quote">"${E(CN(G.cid))} sahaya çıkarken dizleri titreyecek, bu maçın tek favorisi biziz."</div>
          <button class="x" onclick="derbyChoice(1)">${ico('flame',14)} Sert Karşılık Ver (Yüksek Risk / Ödül · +Hücum, yenilgi ağır)</button>
          <button class="x" onclick="derbyChoice(2)">${ico('target',14)} Rakibi Küçümsemeden Öv (Medya +2, Dengeli)</button>
          <button class="x" onclick="derbyChoice(3)">${ico('megaphone',14)} Taraftarı Ateşle (Taraftar +3 · Evde rakip atak -%8 & ekstra momentum)</button>
        </div>
      </div>
    `);
    return;
  }
  play();
}

function derbyChoice(st){
  SFX.tap();
  G.derby.stance=st;
  if(st===1){addRep('med',2);G.mods=G.mods.filter(m=>m.id!=='hype');G.mods.push({id:'hype',w:1})}
  else if(st===2){G.med=C(G.med+2,0,100)}
  else if(st===3){G.fans=C(G.fans+3,0,100);addRep('ply',1)}
  play();
}

const pitchLinesHoriz=`<svg class="lines" viewBox="0 0 160 100" preserveAspectRatio="none"><rect x="2" y="2" width="156" height="96" fill="none" stroke="#fff" stroke-width="1"/><line x1="80" y1="2" x2="80" y2="98" stroke="#fff" stroke-width="1"/><circle cx="80" cy="50" r="13" fill="none" stroke="#fff" stroke-width="1"/><circle cx="80" cy="50" r="1.4" fill="#fff"/><rect x="2" y="22" width="22" height="56" fill="none" stroke="#fff" stroke-width="1"/><rect x="2" y="36" width="8" height="28" fill="none" stroke="#fff" stroke-width="1"/><rect x="136" y="22" width="22" height="56" fill="none" stroke="#fff" stroke-width="1"/><rect x="150" y="36" width="8" height="28" fill="none" stroke="#fff" stroke-width="1"/></svg>`;

function addLog(tag,text){
  const M=G.m;if(!M)return;
  M.log.push({m:M.min,tag,text});
}
function showPitchBanner(title,sub,cls='goal'){
  const M=G.m;if(!M)return;
  M.banner={title,sub,cls};
  updateMatchUI();
  addTo(()=>{
    if(G&&G.m&&G.m.banner&&G.m.banner.title===title){
      G.m.banner=null;
      const gl=$('gl');if(gl)gl.innerHTML='';
    }
  },1200);
}

function play(){
  clearTimers();mdx();
  SFX.whistle();
  const n=nx(),os=(n.op*3+G.wk+G.season)%4,sc=scoutInfo(n.op);
  const homeBonus=(n.home&&G.fans>=35&&!hm('prot'))?3:-1;
  const d=tstr(G.cid)-tstr(n.op)+homeBonus;
  const ad=adv(G.sty,os);
  const advMult=G.scen==='tactician'?0.16:0.08;

  G.inM=1;
  if(G.trn===2)DB.pl.forEach(x=>{if(x.c===G.cid)x.k=Math.min(100,x.k+6)});

  let lf=C(1.42*Math.exp(d/22)*(1+advMult*ad),0.22,4.6);
  let la=C(1.16*Math.exp(-d/22)*(1-advMult*ad),0.20,4.6);

  if(n.home&&G.fans>85){lf*=1.10;la*=0.88}
  if(hm('split'))lf*=0.90;
  if(hm('hype'))lf*=1.10;
  if(hm('prot')&&n.home){lf*=0.92;la*=1.06}

  let startMo=50;
  const matchXI=G.xi.slice();
  const M=G.m={
    n,xi:matchXI,playedIds:matchXI.slice(),redIds:[],
    min:0,gf:0,ga:0,log:[],bx:50,sub:0,yc:hm('disc')?-1:0,rc:0,fl:{},
    ba:(G.trn===0?0.12:0)+0.05*G.agg,
    bd:G.trn===1?-0.12:0,
    lf,la,ps:0,sh:0,sa:0,mo:startMo,banner:null,
    speed:1,paused:false,plan:1,
    focus:0,weakFocus:sc.recFocus,weakName:sc.weakName,
    shoutCd:0,shoutBoost:0,shoutCalm:0,shoutWaste:0,
    subsUsed:[],momHist:[{m:0,v:startMo}],evMarks:[],penRes:null
  };
  if(G.derby&&G.derby.stance===3&&n.home){
    M.la*=0.92;M.mo=59;M.momHist[0].v=59;
    addLog('taktik','Tribün atmosferi rakibi baskı altına aldı (-%8 rakip hücum).');
  }
  if(G.ins===0){M.la*=0.85;M.yc+=1}
  else if(G.ins===1)M.ba+=0.20;
  else if(G.ins===2)M.ba+=0.28;
  else if(G.ins===3){M.la*=0.88;M.lf*=0.95}

  const allMg=MG.ORDER;
  const cntMg=R(4,5);
  const mins=[12,26,40,56,72,82].sort(()=>Math.random()-0.5).slice(0,cntMg).sort((a,b)=>a-b);
  const sch=[];
  let prevT=null;
  for(let j=0;j<cntMg;j++){
    const cands=allMg.filter(t=>t!==prevT);
    const pick=P(cands);
    prevT=pick;
    sch.push({m:mins[j]+R(-3,3),t:pick});
  }
  M.sch=sch.sort((a,b)=>a.m-b.m);

  addLog('taktik',`Maç başladı. Gözlemci: rakip zaafı ${sc.weakName}.`);
  buildMatchUI();
  updateMatchUI();
  go();
}

function go(){
  clearTimers();
  const M=G.m;
  if(!M||M.paused||M.min>=90)return;
  const ms=M.speed===2?100:M.speed===1.5?145:210;
  M.iv=addIv(tick,ms);
}

function setSpeed(sp){
  SFX.tap();
  const M=G.m;if(!M)return;
  if(sp===0){M.paused=!M.paused}
  else{M.speed=sp;M.paused=false}
  if(M.paused)clearTimers();else go();
  updateMatchUI();
}
function setPlan(p){
  SFX.tap();
  const M=G.m;if(!M||M.plan===p)return;
  M.plan=p;
  addLog('taktik',`Oyun planı: ${PLANS[p].full}`);
  updateMatchUI();
}
function setFocus(f){
  SFX.tap();
  const M=G.m;if(!M||M.focus===f)return;
  M.focus=f;
  const hit=f===M.weakFocus?' (Rakip zaafı yakalandı!)':'';
  addLog('taktik',`Atak yönü: ${FOCUS[f].full}${hit}`);
  updateMatchUI();
}
function shout(k){
  const M=G.m;if(!M||M.shoutCd>0)return;
  if(k===2&&(M.min<75||M.gf<=M.ga))return;
  SFX.tap();
  M.shoutCd=15;
  if(k===0){
    M.shoutBoost=10;
    M.xi.forEach(id=>{const p=DB.pl[id];if(p)p.k=Math.max(10,p.k-2.5)});
    addLog('taktik','Kenar talimatı: "BASTIRIN!" (Momentum +, Kondisyon -)');
  }else if(k===1){
    M.shoutCalm=15;
    addLog('taktik','Kenar talimatı: "SAKİNLEŞİN!" (Kart riski azaldı)');
  }else{
    M.shoutWaste=15;G.fans=C(G.fans-1,0,100);

function renderSparklineSVG(M){
  const W=300,H=46,mid=H/2;
  const ptsArr=M.momHist.map(pt=>{
    const x=(pt.m/90)*W;
    const y=H-((C(pt.v,5,95)/100)*H);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const lastX=((M.momHist[M.momHist.length-1]?.m||0)/90)*W;
  const areaPts=`0,${mid} ${ptsArr.join(' ')} ${lastX.toFixed(1)},${mid}`;
  const marks=M.evMarks.map(ev=>{
    const x=(ev.m/90)*W;
    const col=ev.type==='gf'?'#4ade80':ev.type==='ga'?'#f87171':'#ef4444';
    const cy=ev.type==='gf'?8:ev.type==='ga'?H-8:mid;
    return ev.type==='rc'
      ?`<rect x="${(x-2.5).toFixed(1)}" y="${(cy-4).toFixed(1)}" width="5" height="8" rx="1" fill="#ef4444" stroke="#fff" stroke-width=".7"/>`
      :`<circle cx="${x.toFixed(1)}" cy="${cy}" r="3.4" fill="${col}" stroke="#0b1410" stroke-width="1"/>`;
  }).join('');
  return `
    <svg class="spark-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="rgba(255,255,255,.22)" stroke-dasharray="3 3" stroke-width="1"/>
      <line x1="${W/2}" y1="0" x2="${W/2}" y2="${H}" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
      <polygon points="${areaPts}" fill="${clubCol(G.cid)}" opacity=".32"/>
      <polyline points="${ptsArr.join(' ')}" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linejoin="round"/>
      ${marks}
    </svg>`;
}

const scr=()=>{
  const l=G.m.xi.map(i=>DB.pl[i]).filter(Boolean);
  const f=l.filter(x=>x.p>=2),x=P(f.length?f:l);
  if(!x)return 'Golcü';
  if(x.tp===4)G.m.fl.wk=1;
  x.g=(x.g||0)+1;
  return x.n;
};

function avgLineEff(minPos,maxPos){
  if(!G||!G.m)return 70;
  const l=G.m.xi.map(id=>DB.pl[id]).filter(x=>x&&x.p>=minPos&&x.p<=maxPos);
  if(!l.length)return 62;
  return l.reduce((s,x)=>s+eff(x),0)/l.length;
}
function gkEff(){
  if(!G||!G.m)return 70;
  const gk=G.m.xi.map(id=>DB.pl[id]).find(x=>x&&x.p===0);
  return gk?eff(gk):58;
}

function tick(){
  const M=G.m;if(!M)return;
  M.min++;
  if(M.shoutCd>0)M.shoutCd--;
  if(M.shoutBoost>0)M.shoutBoost--;
  if(M.shoutCalm>0)M.shoutCalm--;
  if(M.shoutWaste>0)M.shoutWaste--;

  if(M.min%10===0){
    const drain=(M.plan===2?2.35:M.plan===0?1.55:1.95)+G.agg*0.15;
    M.xi.forEach(id=>{const p=DB.pl[id];if(p)p.k=Math.max(10,p.k-drain)});
  }
  if(G.ins===2&&M.min===46){
    M.ba-=0.35;
    M.xi.forEach(id=>{const p=DB.pl[id];if(p)p.k=Math.max(10,p.k-3)});
  }

  const miss=Math.max(0,11-M.xi.length);
  const missA=Math.max(0.42,1-miss*0.11);
  const missD=1+miss*0.14;

  const cp=G.cap!==null&&M.xi.includes(G.cap);
  const cb=cp?(M.gf<M.ga?0.12:0.03)+(DB.pl[G.cap].tp===0?0.04:0):0;
  const sqComeback=(G.sq>80&&M.gf<M.ga)?0.26:0;
  const planA=M.plan===0?-0.42:M.plan===2?0.36:0;
  const planD=M.plan===0?-0.44:M.plan===2?0.32:0;
  const focusA=M.focus===0?0:(M.focus===M.weakFocus?0.28:0.02);
  const shoutA=M.shoutBoost>0?0.26:0;
  const wasteMod=M.shoutWaste>0?0.48:1;

  const a=Math.max(0.08,(M.lf+M.ba+cb+sqComeback+planA+focusA+shoutA)*wasteMod*missA);
  const b=Math.max(0.08,(M.la+M.bd+planD)*wasteMod*missD);

  M.ps+=a/(a+b+0.01);
  if(Math.random()<a/28)M.sh++;
  if(Math.random()<b/28)M.sa++;

  const u=Math.random()<a/92,v=Math.random()<b/92;
  if(u){
    const scorer=scr();
    M.gf++;M.sh++;
    M.evMarks.push({m:M.min,type:'gf'});
    SFX.goal();
    addLog('gol',`${scorer} ağları sarstı!`);
    showPitchBanner('GOOOOL!',scorer,'goal');
    if(M.min>=85)M.fl.late=1;
  }
  if(v){
    M.ga++;M.sa++;
    M.evMarks.push({m:M.min,type:'ga'});
    SFX.concede();
    addLog('yenilen',`${CN(M.n.op)} gol buldu.`);
    showPitchBanner('GOL YEDİN',CN(M.n.op),'concede');
  }
  M.mo=C(M.mo*0.85+(50+(a-b)*20)*0.15,8,92);
  if(M.min%5===0)M.momHist.push({m:M.min,v:Math.round(M.mo)});
  M.bx=C(M.bx+R(-9,9)+(a>b?2.5:-2.5),6,94);
  updateMatchUI();

  if(M.min===45){clearTimers();SFX.whistle();return halftime()}
  const e=M.sch[0];
  if(e&&M.min>=e.m){
    M.sch.shift();
    if(e.t==='kart'&&M.shoutCalm>0&&Math.random()<0.65){
      addLog('taktik','Takım sakin kaldı, kart krizi önlendi.');
      updateMatchUI();
    }else{
      clearTimers();return MG.launch(e.t,false);
    }
  }
  if(M.min>=90){clearTimers();SFX.whistle();fin2()}
}

        </div>
        ${M.subOut===null?`
          <p class="m" style="margin:6px 0">Sahadan çıkacak oyuncuyu seç (kondisyon durumuna göre sıralı):</p>
          ${xi.slice().sort((a,b)=>a.k-b.k).map(x=>`
            <button class="x r" style="padding:9px 10px" onclick="G.m.subOut=${x.id};openSub(${x.id})">
              <span><b>#${x.no} ${E(x.n)}</b> · ${PN[x.p]} · ${x.o}</span>
              <span class="pill ${x.k<55?'neg':x.k<75?'neu':'pos'}" style="margin:0">${Math.round(x.k)}%</span>
            </button>
          `).join('')}
        `:`
          <p class="m" style="margin:6px 0">Çıkacak: <b>${E(DB.pl[M.subOut].n)} (${PN[DB.pl[M.subOut].p]}, ${Math.round(DB.pl[M.subOut].k)}%)</b> — Girecek yedeği seç:</p>
          ${bn.length?bn.map(y=>{
            const idx=M.xi.indexOf(M.subOut);
            const slot=SLOTS[G.f][idx]||{pos:DB.pl[M.subOut].p};
            const fit=slotFit(y,slot);
            const fitCls=fit>=0.99?'pos':fit>=0.85?'neu':'neg';
            return`<button class="x r" style="padding:9px 10px" onclick="doSub(${M.subOut},${y.id})">
              <span><b>#${y.no} ${E(y.n)}</b> · ${PN[y.p]} · OVR ${y.o}</span>
              <span class="pill ${fitCls}" style="margin:0">${Math.round(y.k)}% · ${fit>=0.99?'Tam Uyum':fit>=0.85?'Yakın':'Ters'}</span>
            </button>`;
          }).join(''):'<p class="m">Müsait yedek oyuncu yok.</p>'}
          <button class="x center" onclick="openSub()">Farklı Oyuncu Seç</button>
        `}
      </div>
    </div>`;
}

function doSub(outId,inId){
  SFX.tap();
  const M=G.m,t=DB.pl[outId],y=DB.pl[inId];
  const idx=M.xi.indexOf(outId);
  if(idx>=0){
    const slot=SLOTS[G.f][idx]||{pos:t.p};
    const oldEff=eff(t)*slotFit(t,slot);
    const newEff=eff(y)*slotFit(y,slot);
    const diff=(newEff-oldEff)/55;

    M.xi[idx]=inId;
    if(!M.playedIds.includes(inId))M.playedIds.push(inId);
    M.sub++;M.subsUsed.push(outId);

    if(slot.pos===3){M.lf=C(M.lf+diff*1.15,0.18,5.0);M.la=C(M.la-diff*0.15,0.18,5.0)}
    else if(slot.pos===2){M.lf=C(M.lf+diff*0.65,0.18,5.0);M.la=C(M.la-diff*0.55,0.18,5.0)}
    else{M.la=C(M.la-diff*1.15,0.18,5.0);M.lf=C(M.lf+diff*0.15,0.18,5.0)}
    const tag=diff>=0.04?'taze güç kattı':diff<=-0.08?'mevki uyumsuzluğu yarattı':'dengeli hamle';
    addLog('deg',`${t.n} (${Math.round(t.k)}%) → ${y.n} (${Math.round(y.k)}%, ${tag}).`);
  }
  closeSub();
}
function closeSub(){
  mdx();
  if(G&&G.m){G.m.paused=false;updateMatchUI();go()}
}

    const authB=domRep()==='auth'?1.25:1;

    addLog('taktik','Devre arası: Takıma sert uyarılarda bulundun.');
  }else if(i===1){

    M.ba+=0.14*mult*plyB;M.bd-=0.14*mult*plyB;

  }else{
    M.bd-=0.26*mult;

  }

}
