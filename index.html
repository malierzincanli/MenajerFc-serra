          ${zones.map(z=>`<button class="mg-zone" onpointerdown="penShootBar(${z.i})">${ico('target',18)}<span>${z.n}</span></button>`).join('')}
        </div>
      </div>
    `);
  }else{
    const gk=gkEff();
    const reactMs=C(Math.round(960+(gk-70)*12),860,1180);
    const target=R(0,2);
    let armed=false,done=false;
    S(`${mh()}
      <div class="mg-card">
        ${penHeaderHTML()}
        <div class="mg-cmd" id="pen-sv-cmd">Rakip Penaltısı! Hazır ol...</div>
        <div class="mg-goal-grid" style="grid-template-columns:repeat(3,1fr);min-height:125px">
          ${['SOL','ORTA','SAĞ'].map((lb,i)=>`<button class="mg-zone" style="min-height:105px;font-size:14px" id="pen-sv-${i}" onpointerdown="penSaveTap(${i})">${ico('shield',22)}<span>${lb}</span></button>`).join('')}
        </div>
      </div>
    `);
    addTo(()=>{
      if(done)return;
      armed=true;
      const cmd=$('pen-sv-cmd'),el=$('pen-sv-'+target);
      if(cmd)cmd.textContent='KIRMIZI KÖŞEYE DOKUN!';
      if(el){el.classList.add('hot');el.innerHTML=`${ico('ball',26)}<span>ŞUT!</span>`}
      addTo(()=>{
        if(!done){done=true;penResolveSave(false)}
      },reactMs);
    },420);
    window.penSaveTap=(i)=>{
      if(done||!armed)return;
      done=true;clearTimers();
      penResolveSave(i===target);
    };
  }
}

function penShootBar(zoneIdx){
  SFX.tap();
  const att=avgLineEff(2,3);
  const w=C(Math.round(20+G.fac[0]*2.5+(G.trn===3?6:0)+(att-65)*0.32),18,40);
  const speed=C(3.3-(att-65)*0.022,2.2,3.7);
  let pos=4,dir=1,fired=false;

  S(`${mh()}
    <div class="mg-card">
      ${penHeaderHTML()}
      <div class="mg-cmd">Yeşil bölgede VUR!</div>
      <div class="mg-bar">
        <div class="mg-zn" style="left:${50-w/2}%;width:${w}%"></div>
        <div class="mg-mk" id="pen-dt-mk" style="left:4%"></div>
      </div>
      <button class="ok-btn" style="font-size:16px;min-height:52px" id="pen-dt-btn">${ico('ball',18)} VUR!</button>
    </div>
  `);

  const mkEl=$('pen-dt-mk');
  addIv(()=>{
    pos+=dir*speed;
    if(pos>=94){pos=94;dir=-1}
    else if(pos<=2){pos=2;dir=1}
    if(mkEl)mkEl.style.left=pos+'%';
  },22);

  const shoot=()=>{
    if(fired)return;
    fired=true;clearTimers();
    const dist=Math.abs(pos-48);
    const inGreen=dist<=w/2;
    const bullseye=dist<=w/4;
    const keeperCol=R(0,2);
    const sameCol=keeperCol===(zoneIdx%3);
    const isGoal=inGreen&&(!sameCol||bullseye||Math.random()<0.52);

    if(isGoal){PEN.myScore++;PEN.myDots.push(1);SFX.goal()}
    else{PEN.myDots.push(0);SFX.bad()}

    S(`${mh()}
      <div class="mg-card">
        ${penHeaderHTML()}
        <div style="text-align:center;padding:18px 8px">
          <div class="big" style="color:${isGoal?'#4ade80':'#f87171'}">${isGoal?'PENALTI GOLÜ!':'KAÇTI / KURTARILDI!'}</div>
          <p class="m" style="color:rgba(255,255,255,.8)">Şimdi rakip penaltısını kurtarma sırası...</p>
        </div>
      </div>
    `);
    PEN.phase='save';
    addTo(()=>penNextStep(),850);
  };
  const btn=$('pen-dt-btn');
  if(btn)btn.onpointerdown=shoot;
}

function penResolveSave(saved){
  if(saved){PEN.opDots.push(0);SFX.save()}
  else{PEN.opScore++;PEN.opDots.push(1);SFX.concede()}

  const P=PEN;
  let finished=false;
  if(P.round<3){
    const rem=3-P.round;
    if(P.myScore>P.opScore+rem||P.opScore>P.myScore+rem)finished=true;
  }else if(P.myScore!==P.opScore){
    finished=true;
  }

  S(`${mh()}
    <div class="mg-card">
      ${penHeaderHTML()}
      <div style="text-align:center;padding:18px 8px">
        <div class="big" style="color:${saved?'#4ade80':'#f87171'}">${saved?'KURTARDIN!':'RAKİP ATTI!'}</div>
        <p class="m" style="color:rgba(255,255,255,.8)">${finished?(P.myScore>P.opScore?'Penaltı serisini kazandın!':'Penaltı serisini kaybettin.'):'Sonraki penaltı turuna geçiliyor...'}</p>
      </div>
    </div>
  `);

  if(finished){
    G.m.penRes={my:P.myScore,op:P.opScore,won:P.myScore>P.opScore};
    addTo(()=>fin2(true),1100);
  }else{
    P.round++;P.phase='shoot';
    addTo(()=>penNextStep(),900);
  }
}

/* ==================== MODULAR 12 TOUCH MINI-GAMES CONTROLLER (MG) ==================== */
const MG={
  ORDER:['dt','cnt','ref','save','corner','press','kart','opp','wall','offside','dribble','kdist'],
  META:{
    dt:{ic:'target',title:'DURAN TOP!',sub:'Açık köşeyi bul ve vur!',col:'#10b981'},
    cnt:{ic:'zap',title:'KONTRA ATAK!',sub:'Sırayla pas zincirini tamamla!',col:'#0ea5e9'},
    ref:{ic:'shield',title:'TEHLİKE!',sub:'Halka yeşildeyken müdahale et!',col:'#f59e0b'},
    save:{ic:'shield',title:'KURTARIŞ!',sub:'Gerçek şut köşesine hızlı dokun!',col:'#ef4444'},
    corner:{ic:'ball',title:'KORNER!',sub:'Top yeşildeyken kafa vur!',col:'#22c55e'},
    press:{ic:'flame',title:'PRES TUZAĞI!',sub:'Zayıf kontrol anında kap!',col:'#eab308'},
    kart:{ic:'cardYellow',title:'SİNİR HARBİ!',sub:'İbreyi yeşil bölgede tut!',col:'#f97316'},
    opp:{ic:'board',title:'TAKTİK SATRANCI',sub:'Rakip hamlesini oku ve çöz!',col:'#8b5cf6'},
    wall:{ic:'shield',title:'BARAJ KUR & ZIPLA!',sub:'Top gelirken barajı sıçrat!',col:'#14b8a6'},
    offside:{ic:'pin',title:'OFSAYT TUZAĞI!',sub:'Forvet çizgiyi geçince bayrağı kaldır!',col:'#e11d48'},
    dribble:{ic:'zap',title:'ÇALIM / SLALOM!',sub:'Şerit değiştirip savunmacılardan sıyrıl!',col:'#6366f1'},
    kdist:{ic:'ball',title:'KALECİ DEGAJI!',sub:'Koşan kanat oyuncusunu topla buluştur!',col:'#0284c7'}
  },
  demoMode:false,
  demoIdx:0,
  locked:false,

  startDemo(){
    clearTimers();mdx();
    this.demoMode=true;
    this.demoIdx=0;
    G.inM=1;
    this.launch(this.ORDER[0],true);
  },
  exitDemo(){
    clearTimers();
    this.demoMode=false;
    G.inM=0;
    render();
  },
  nextDemo(){
    clearTimers();
    this.demoIdx++;
    if(this.demoIdx>=this.ORDER.length){
      SFX.ok();
      toast('Tüm 12 mini oyun tamamlandı!','ok');
      return this.exitDemo();
    }
    this.launch(this.ORDER[this.demoIdx],true);
  },

  launch(type,isDemo){
    clearTimers();
    this.demoMode=!!isDemo;
    this.locked=false;
    const meta=this.META[type]||this.META.dt;
    S(`${mh()}
      <div class="mg-card">
        <div class="mg-flash">
          <div class="mg-flash-ic" style="background:${meta.col}">${ico(meta.ic,36)}</div>
          <div class="big" style="font-size:26px;letter-spacing:.04em">${meta.title}</div>
          <div style="font-size:14px;opacity:.85;font-weight:700">${meta.sub}</div>
        </div>
      </div>
    `);
    addTo(()=>{
      if(!G||!G.inM)return;
      const fn=this['play_'+type];
      if(fn)fn.call(this);
      else this.resumeMatch();
    },560);
  },

  finish(ok,headline,detail,onApply,extraVisual=''){
    if(this.locked)return;
    this.locked=true;
    clearTimers();
    if(ok===true)SFX.ok();else if(ok===false)SFX.bad();
    if(!this.demoMode&&onApply)onApply();
    const bg=ok===true?'#065f46':ok===false?'#7f1d1d':'#1e3a8a';
    const ic=ok===true?'check':ok===false?'x':'zap';
    S(`${mh()}
      <div class="mg-card" style="border-color:${bg}">
        ${extraVisual}
        <div style="text-align:center;padding:12px 6px">
          <div style="display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:16px;background:${bg};margin-bottom:8px">${ico(ic,28)}</div>
          <div class="big" style="font-size:22px">${E(headline)}</div>
          <div style="font-size:13px;opacity:.85;margin-top:4px">${E(detail)}</div>
          ${this.demoMode?`
            <div class="g2" style="margin-top:14px">
              <button class="x center" style="margin:0" onclick="MG.launch('${this.ORDER[this.demoIdx]}',true)">${ico('refresh',13)} Tekrar Dene</button>
              <button style="margin:0" onclick="MG.nextDemo()">${this.demoIdx<this.ORDER.length-1?'Sonraki ('+(this.demoIdx+2)+'/'+this.ORDER.length+')':'Bitir'}</button>
            </div>
          `:''}
        </div>
      </div>
    `);
    if(!this.demoMode){
      addTo(()=>this.resumeMatch(),950);
    }
  },

  resumeMatch(){
    clearTimers();
    if(!G||!G.m){this.exitDemo();return}
    buildMatchUI();updateMatchUI();go();
  },

  /* 1) GÖRSEL PENALTI / BARAJLI FRİKİK / 1v1 AŞIRTMA (dt - 3 Senaryo) */
  play_dt(){
    const scen=R(0,2); // 0: Penaltı, 1: Barajlı Frikik, 2: 1v1 Aşırtma/Köşe
    const zones=[
      {i:0,n:'Sol Üst'},{i:1,n:'Orta Üst'},{i:2,n:'Sağ Üst'},
      {i:3,n:'Sol Alt'},{i:4,n:'Orta Alt'},{i:5,n:'Sağ Alt'}
    ];
    const blocked=scen===1?(Math.random()<0.5?[3,4]:[4,5]):[];
    const title=scen===0?'Penaltı: Kalede köşeni seç!':scen===1?'Barajlı Frikik: Baraj dışı açık köşeyi seç!':'1v1 Kaleciyle Karşı Karşıya: Aşırtma/Köşe seç!';
    S(`${mh()}
      <div class="mg-card">
        <div class="mg-cmd">${title}</div>
        <div class="mg-goal-grid">
          ${zones.map(z=>{
            const isBlk=blocked.includes(z.i);
            const lbl=scen===2&&z.i<3?z.n+' (Aşırtma)':z.n;
            return isBlk
              ?`<button class="mg-zone blocked" disabled>${ico('shield',18)}<span>BARAJ</span></button>`
              :`<button class="mg-zone" onpointerdown="MG.dtStep2(${z.i},${scen})">${ico('target',18)}<span>${lbl}</span></button>`;
          }).join('')}
        </div>
      </div>
    `);
  },
  dtStep2(zoneIdx,scen=0){
    if(this.locked)return;
    SFX.tap();
    const att=avgLineEff(2,3);
    const w=C(Math.round(18+G.fac[0]*2.5+(G.trn===3?7:0)+(att-65)*0.35),16,40);
    const speed=C(3.4-(att-65)*0.025+(scen===1?0.25:0),2.2,4.0);
    let pos=4,dir=1,fired=false;

    S(`${mh()}
      <div class="mg-card">
        <div class="mg-cmd">2. Adım: Yeşil bölgede VUR!</div>
        <div class="mg-bar">
          <div class="mg-zn" style="left:${50-w/2}%;width:${w}%"></div>
          <div class="mg-mk" id="mg-dt-mk" style="left:4%"></div>
        </div>
        <button class="ok-btn" style="font-size:16px;min-height:52px" id="mg-dt-btn">${ico('ball',18)} VUR!</button>
      </div>
    `);

    const mkEl=$('mg-dt-mk');
    addIv(()=>{
      pos+=dir*speed;
      if(pos>=94){pos=94;dir=-1}
      else if(pos<=2){pos=2;dir=1}
      if(mkEl)mkEl.style.left=pos+'%';
    },22);

    const shoot=()=>{
      if(fired||this.locked)return;
      fired=true;clearTimers();
      const dist=Math.abs(pos-48);
      const inGreen=dist<=w/2;
      const bullseye=dist<=w/4;
      const keeperZone=P([0,1,2,3,4,5]);
      const sameCol=(keeperZone%3)===(zoneIdx%3);
      const isGoal=inGreen&&(!sameCol||bullseye||Math.random()<0.45);

      const zx=[22,50,78][zoneIdx%3],zy=zoneIdx<3?28:66;
      const kx=[22,50,78][keeperZone%3],ky=keeperZone<3?34:66;
      const svg=`<div class="mg-svg-wrap" style="background:#0f3d21">
        <svg viewBox="0 0 200 90" width="100%" height="90" style="display:block">
          <rect x="16" y="10" width="168" height="72" fill="none" stroke="#fff" stroke-width="4"/>
          <circle cx="${kx*2}" cy="${ky}" r="11" fill="#f59e0b" stroke="#111" stroke-width="2"/>
          <text x="${kx*2}" y="${ky+3.5}" text-anchor="middle" fill="#111" font-size="9" font-weight="900">KL</text>
          <circle cx="${zx*2}" cy="${isGoal?zy:zy-16}" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
        </svg>
      </div>`;

      this.finish(
        isGoal,
        isGoal?'GOOOOL!':(sameCol?'KALECİ KURTARDI!':'AUTA GİTTİ!'),
        isGoal?(scen===2?'Kalecinin üzerinden nefis aşırtma!':'Köşeye harika vuruş!'):(inGreen?'Kaleci köşeyi doğru tahmin etti.':'Zamanlama yeşil alanın dışında kaldı.'),
        ()=>{
          const M=G.m;M.sh++;
          if(isGoal){
            const s=scr();M.gf++;M.evMarks.push({m:M.min,type:'gf'});SFX.goal();
            addLog('gol',`Duran toptan ${s} ağları havalandırdı!`);
            showPitchBanner('GOOOOL!',s,'goal');
          }else{
            M.ba+=inGreen?0.10:-0.05;
            addLog('taktik',sameCol?'Duran topta kaleci kurtarış yaptı.':'Duran top şutu çerçeveyi bulmadı.');
          }
        },
        svg
      );
    };
    const btn=$('mg-dt-btn');
    if(btn)btn.onpointerdown=shoot;
  },

  /* 2) PAS ZİNCİRİ (cnt - 3 Senaryo: 3'lü Tiki-Taka, 4'lü Kanat Bindirmesi, Hareketli Savunma) */
  play_cnt(){
    const att=avgLineEff(2,3);
    const scen=R(0,2); // 0: 3-step, 1: 4-step wing, 2: moving defenders
    const need=scen===1?4:3;
    const dur=C((scen===1?4400:3900)+(att-65)*22,3600,4800);
    const pool=[
      {x:48,y:132},{x:110,y:46},{x:205,y:132},{x:255,y:50},{x:155,y:92}
    ].sort(()=>Math.random()-0.5);
    const mates=pool.slice(0,need);
    const defs=[{x:135,y:75,dx:1.6},{x:195,y:110,dx:-1.6}];
    let nextStep=1,done=false;

    const renderPitch=()=>{
      let lines='';
      for(let i=0;i<nextStep-2;i++){
        lines+=`<line x1="${mates[i].x}" y1="${mates[i].y}" x2="${mates[i+1].x}" y2="${mates[i+1].y}" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>`;
      }
      return `<svg viewBox="0 0 300 175" width="100%" height="175" style="display:block">
        <rect x="6" y="6" width="288" height="163" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
        <line x1="150" y1="6" x2="150" y2="169" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>
        ${lines}
        ${defs.map((d,idx)=>`<circle id="mg-cd-${idx}" cx="${d.x}" cy="${d.y}" r="13" fill="#dc2626" stroke="#fff" stroke-width="2"/><text id="mg-cdt-${idx}" x="${d.x}" y="${d.y+4}" text-anchor="middle" fill="#fff" font-size="11" font-weight="900">X</text>`).join('')}
        ${mates.map((m,idx)=>{
          const num=idx+1,hit=num<nextStep;
          return`<g style="cursor:pointer" onpointerdown="MG.cntTap(${num})">
            <circle cx="${m.x}" cy="${m.y}" r="22" fill="${hit?'#10b981':'#2563eb'}" stroke="#fff" stroke-width="3"/>
            <text x="${m.x}" y="${m.y+6}" text-anchor="middle" fill="#fff" font-size="17" font-weight="900">${num}</text>
          </g>`;
        }).join('')}
      </svg>`;
    };

    const cmdTxt=scen===1?'4\'lü Kanat Bindirmesi: 1 → 2 → 3 → 4!':scen===2?'Hareketli Savunma Arasından 1 → 2 → 3!':'Tiki-Taka: Sırayla 1 → 2 → 3 dokun!';
    S(`${mh()}
      <div class="mg-card">
        <div class="mg-cmd">${cmdTxt}</div>
        <div class="mg-timer"><i id="mg-cnt-tm" style="width:100%;transition:width ${dur}ms linear"></i></div>
        <div class="mg-svg-wrap" id="mg-cnt-svg">${renderPitch()}</div>
      </div>
    `);
    addTo(()=>{const el=$('mg-cnt-tm');if(el)el.style.width='0%'},30);

    if(scen===2){
      addIv(()=>{
        if(done)return;
        defs.forEach((d,idx)=>{
          d.x+=d.dx;if(d.x>255||d.x<45)d.dx*=-1;
          const c=$('mg-cd-'+idx),t=$('mg-cdt-'+idx);
          if(c)c.setAttribute('cx',d.x.toFixed(1));
          if(t)t.setAttribute('x',d.x.toFixed(1));
        });
      },30);
    }

    this.cntTap=(num)=>{
      if(done||this.locked)return;
      if(num===nextStep){
        SFX.tap();
        nextStep++;
        const wrap=$('mg-cnt-svg');
        if(wrap)wrap.innerHTML=renderPitch();
        if(nextStep>need){
          done=true;
          const prob=C(0.65+(att-62)*0.009,0.65,0.85);
          const isGoal=Math.random()<prob;
          this.finish(
            true,
            isGoal?'TİKİ-TAKA GOLÜ!':'MÜTHİŞ ATAK!',
            isGoal?`${need}'lü pas zinciri ağlarla buluştu!`:'Kaleci son anda çıkardı, momentum senin!',
            ()=>{
              const M=G.m;M.sh++;
              if(isGoal){
                const s=scr();M.gf++;M.evMarks.push({m:M.min,type:'gf'});SFX.goal();
                addLog('gol',`Kontra pas zinciriyle ${s} golü attı!`);
                showPitchBanner('KONTRA GOLÜ!',s,'goal');
              }else{
                M.mo=C(M.mo+10,8,92);M.ba+=0.10;
                addLog('taktik','Harika pas zinciri, kaleci son anda çıkardı.');
              }
            }
          );
        }
      }else{
        done=true;
        this.finish(false,'PAS KESİLDİ!','Yanlış sıraya dokundun, rakip topu kaptı.',()=>{
          G.m.ba-=0.06;addLog('taktik','Kontra atakta pas hatası yapıldı.');
        });
      }
    };

    addTo(()=>{
      if(!done&&!this.locked){
        done=true;
        this.finish(false,'SÜRE DOLDU!','Rakip savunma geriye dönüp kapandı.',()=>{
          G.m.ba-=0.05;addLog('taktik','Kontra fırsatında geç kalındı.');
        });
      }
    },dur);
  },

  /* 3) DARALAN MÜDAHALE HALKASI (ref - 2 Senaryo) */
  play_ref(){
    const def=avgLineEff(0,1);
    const scen=R(0,1); // 0: Kayarak Müdahale, 1: Ceza Sahası Çizgisi Blokajı
    const targetR=scen===1?28:34;
    const tol=C((scen===1?8.5:10)+(def-64)*0.22+(G.trn===1?4:0),7.5,17);
    const speed=C((scen===1?1.65:1.4)-(def-65)*0.012,1.0,1.8);
    let r=86,done=false;

    S(`${mh()}
      <div class="mg-card">
        <div class="mg-cmd">${scen===1?'Ceza Sahası Çizgisi Blokajı: Tam yeşilde bas!':'Kayarak Müdahale: Halka yeşildeyken dokun!'}</div>
        <div class="mg-svg-wrap" id="mg-ref-area" style="background:#0f2e1c;cursor:pointer">
          <svg viewBox="0 0 200 180" width="100%" height="180" style="display:block">
            <circle cx="100" cy="90" r="${targetR}" fill="none" stroke="#10b981" stroke-width="${tol*1.4}" opacity=".32"/>
            <circle cx="100" cy="90" r="${targetR}" fill="none" stroke="#4ade80" stroke-width="2.5"/>
            <circle id="mg-ref-ring" cx="100" cy="90" r="${r}" fill="none" stroke="#facc15" stroke-width="4.5"/>
            <circle cx="100" cy="90" r="11" fill="#fff" stroke="#111" stroke-width="2"/>
          </svg>
        </div>
        <button class="ok-btn" id="mg-ref-btn" style="min-height:50px;font-size:15px">${ico('shield',16)} ${scen===1?'BLOKAJ YAP':'MÜDAHALE ET'}</button>
      </div>
    `);

    const ringEl=$('mg-ref-ring');
    addIv(()=>{
      if(done)return;
      r-=speed;
      if(ringEl)ringEl.setAttribute('r',Math.max(8,r).toFixed(1));
      if(r<=12){
        done=true;
        const concede=Math.random()<0.48;
        this.finish(false,concede?'GOL YEDİN!':'GEÇ KALDIN!',concede?'Rakip boşluktan yararlanıp golü attı.':'Rakip şut çekti, top direği yaladı.',()=>{
          const M=G.m;M.sa++;
          if(concede){M.ga++;M.evMarks.push({m:M.min,type:'ga'});SFX.concede();addLog('yenilen',`${CN(M.n.op)} savunma açığından gol buldu.`);showPitchBanner('GOL YEDİN',CN(M.n.op),'concede')}
          else addLog('taktik','Müdahalede geç kalındı, şut auta çıktı.');
        });
      }
    },22);

    const tackle=()=>{
      if(done||this.locked)return;
      done=true;clearTimers();
      const diff=Math.abs(r-targetR);
      if(diff<=tol){
        this.finish(true,scen===1?'KRİTİK BLOKAJ!':'TEMİZ MÜDAHALE!','Topu tertemiz kestin, tehlike bitti!',()=>{
          G.m.bd-=0.16;G.m.mo=C(G.m.mo+8,8,92);
          addLog('kurt','Zamanlı müdahaleyle tehlikeli atak kesildi.');
        });
      }else if(r>targetR+tol){
        const foulGoal=Math.random()<0.28;
        this.finish(false,'ERKEN MÜDAHALE!','Tehlikeli faul yaptın, rakip duran top kazandı.',()=>{
          const M=G.m;M.yc++;SFX.card();
          if(foulGoal){M.ga++;M.sa++;M.evMarks.push({m:M.min,type:'ga'});addLog('yenilen','Erken faul sonrası duran toptan gol yedin.');showPitchBanner('GOL YEDİN','Duran Top','concede')}
          else addLog('kart','Erken müdahale sonucu tehlikeli faul yapıldı.');
        });
      }else{
        const concede=Math.random()<0.45;
        this.finish(false,concede?'GOL YEDİN!':'ÇALIMI YEDİN!',concede?'Rakip seni geçip ağları buldu.':'Rakip geçti ama şutu çerçeveyi bulmadı.',()=>{
          const M=G.m;M.sa++;
          if(concede){M.ga++;M.evMarks.push({m:M.min,type:'ga'});SFX.concede();addLog('yenilen',`${CN(M.n.op)} bire birde geçip gol attı.`);showPitchBanner('GOL YEDİN',CN(M.n.op),'concede')}
          else addLog('taktik','Rakip savunmayı geçti ama şut dışarı çıktı.');
        });
      }
    };
    const b1=$('mg-ref-btn'),b2=$('mg-ref-area');
    if(b1)b1.onpointerdown=tackle;
    if(b2)b2.onpointerdown=tackle;
  },

  /* 4) KALECİ REFLEKS KURTARIŞI (save - 2 Senaryo: 3 Köşe / 4 Köşe + Yalancı Şut) */
  play_save(){
    const gk=gkEff();
    const scen=R(0,1); // 0: 3 köşe yakın mesafe, 1: 4 köşe + yalancı şut
    const cols=scen===1?4:3;
    const labels=scen===1?['SOL ÜST','SAĞ ÜST','SOL ALT','SAĞ ALT']:['SOL','ORTA','SAĞ'];
    const reactMs=C(Math.round(950+(gk-70)*12),860,1180);
    const fakeIdx=R(0,cols-1);
    const target=(fakeIdx+R(1,cols-1))%cols;
    let armed=false,done=false;

    S(`${mh()}
      <div class="mg-card">
        <div class="mg-cmd" id="mg-sv-cmd">${scen===1?'Yalancı şuta kanma! Gerçek KIRMIZI köşeyi bekle!':'Hazır ol! Top geliyor...'}</div>
        <div class="mg-goal-grid" style="grid-template-columns:repeat(${scen===1?2:3},1fr);min-height:130px">
          ${labels.map((lb,i)=>`<button class="mg-zone" style="min-height:${scen===1?62:110}px;font-size:13px" id="mg-sv-${i}" onpointerdown="MG.saveTap(${i})">${ico('shield',20)}<span>${lb}</span></button>`).join('')}
        </div>
      </div>
    `);

    const armReal=()=>{
      if(done||this.locked)return;
      armed=true;
      const cmd=$('mg-sv-cmd'),el=$('mg-sv-'+target);
      if(cmd)cmd.textContent='KIRMIZI KÖŞEYE DOKUN!';
      if(el){el.classList.add('hot');el.innerHTML=`${ico('ball',24)}<span>ŞUT BURADA!</span>`}
      addTo(()=>{
        if(!done&&!this.locked){
          done=true;
          this.finish(false,'GOL YEDİN!','Refleks kurtarışı için geç kaldın.',()=>{
            const M=G.m;M.ga++;M.sa++;M.evMarks.push({m:M.min,type:'ga'});SFX.concede();
            addLog('yenilen',`${CN(M.n.op)} karşı karşıya pozisyonda golü attı.`);
            showPitchBanner('GOL YEDİN',CN(M.n.op),'concede');
          });
        }
      },reactMs);
    };

    if(scen===1){
      addTo(()=>{
        if(done||this.locked)return;
        const fk=$('mg-sv-'+fakeIdx);
        if(fk){fk.classList.add('fake');fk.innerHTML=`${ico('zap',20)}<span>SAHTE!</span>`}
        addTo(()=>{
          if(fk){fk.classList.remove('fake');fk.innerHTML=`${ico('shield',20)}<span>${labels[fakeIdx]}</span>`}
          armReal();
        },360);
      },320);
    }else{
      addTo(armReal,400);
    }

    this.saveTap=(i)=>{
      if(done||this.locked)return;
      if(!armed){
        done=true;clearTimers();
        this.finish(false,'YALANCI ŞUTA DÜŞTÜN!','Çok erken atladın, rakip boş köşeye bıraktı!',()=>{
          const M=G.m;M.ga++;M.sa++;M.evMarks.push({m:M.min,type:'ga'});SFX.concede();
          addLog('yenilen',`${CN(M.n.op)} yalancı şutla kaleciyi yatırdı.`);
          showPitchBanner('GOL YEDİN',CN(M.n.op),'concede');
        });
        return;
      }
      done=true;clearTimers();
      if(i===target){
        SFX.save();
        this.finish(true,'MUHTEŞEM KURTARIŞ!','Kalecin doksandan çıkardı!',()=>{
          const M=G.m;M.sa++;M.mo=C(M.mo+12,8,92);M.bd-=0.12;
          addLog('kurt','Kalecinden maçı kurtaran refleks kurtarış!');
          showPitchBanner('KURTARIŞ!','Muhteşem Refleks','save');
        });
      }else{
        this.finish(false,'TERS KÖŞE!','Yanlış köşeye uçtun, top ağlarda!',()=>{
          const M=G.m;M.ga++;M.sa++;M.evMarks.push({m:M.min,type:'ga'});SFX.concede();
          addLog('yenilen',`${CN(M.n.op)} kaleciyi ters köşeye yatırdı.`);
          showPitchBanner('GOL YEDİN',CN(M.n.op),'concede');
        });
      }
    };
  },

  /* 5) KORNER / ORTA KESİŞİMİ (corner - 3 Farklı Orta Yörüngesi) */
  play_corner(){
    const att=avgLineEff(2,3);
    const scen=R(0,2); // 0: Ön Direk, 1: Arka Direk Yüksek, 2: Yerden Penaltı Noktası
    const sweetT=scen===0?0.58:scen===1?0.74:0.65;
    const tol=C(0.085+(att-65)*0.002+(G.trn===3?0.025:0),0.07,0.14);
    let t=0,done=false;

    const ptAt=u=>{
      if(scen===0)return{x:(1-u)*(1-u)*280+2*(1-u)*u*190+u*u*65,y:(1-u)*(1-u)*155+2*(1-u)*u*25+u*u*55};
      if(scen===1)return{x:(1-u)*(1-u)*280+2*(1-u)*u*175+u*u*35,y:(1-u)*(1-u)*155+2*(1-u)*u*8+u*u*105};
      return{x:(1-u)*(1-u)*280+2*(1-u)*u*200+u*u*105,y:(1-u)*(1-u)*155+2*(1-u)*u*125+u*u*85};
    };
    const pathD=scen===0?'M280 155 Q190 25 65 55':scen===1?'M280 155 Q175 8 35 105':'M280 155 Q200 125 105 85';
    const sw=ptAt(sweetT);
    const title=['Ön Direk Kavisli Orta: Yeşilde KAFA VUR!','Arka Direk Yüksek Orta: Yeşilde KAFA VUR!','Yerden Penaltı Noktasına Kesme: Yeşilde VUR!'][scen];

    S(`${mh()}
      <div class="mg-card">
        <div class="mg-cmd">${title}</div>
        <div class="mg-svg-wrap" id="mg-cr-area" style="background:#14522d">
          <svg viewBox="0 0 300 170" width="100%" height="170" style="display:block">
            <rect x="10" y="10" width="170" height="120" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2"/>
            <rect x="10" y="40" width="50" height="60" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2"/>
            <path d="${pathD}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-dasharray="6 5"/>
            <circle cx="${sw.x.toFixed(1)}" cy="${sw.y.toFixed(1)}" r="22" fill="rgba(16,185,129,.28)" stroke="#4ade80" stroke-width="3"/>
            <circle id="mg-cr-ball" cx="280" cy="155" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
          </svg>
        </div>
        <button class="ok-btn" id="mg-cr-btn" style="min-height:52px;font-size:16px">${ico('ball',18)} ${scen===2?'GELİŞİNE VUR!':'KAFA VURUŞU!'}</button>
      </div>
    `);

    const ballEl=$('mg-cr-ball');
    addIv(()=>{
      if(done)return;
      t+=0.017;
      const p=ptAt(Math.min(1,t));
      if(ballEl){ballEl.setAttribute('cx',p.x.toFixed(1));ballEl.setAttribute('cy',p.y.toFixed(1))}
      if(t>=1){
        done=true;
        this.finish(false,'ORTA GEÇTİ!','Vuruş zamanlamasını kaçırdın.',()=>{
          addLog('taktik','Korner ortası ceza sahasından taca çıktı.');
        });
      }
    },22);

    const head=()=>{
      if(done||this.locked)return;
      done=true;clearTimers();
      const diff=Math.abs(t-sweetT);
      if(diff<=tol){
        const goalProb=C(0.70+(att-65)*0.008,0.65,0.88);
        const isGoal=Math.random()<goalProb;
        this.finish(true,isGoal?'KAFA GOLÜ!':'DİREKTEN DÖNDÜ!',isGoal?'Harika yükselip köşeye bıraktın!':'Müthiş vuruş üst direkten döndü!',()=>{
          const M=G.m;M.sh++;
          if(isGoal){
            const s=scr();M.gf++;M.evMarks.push({m:M.min,type:'gf'});SFX.goal();
            addLog('gol',`Kornerden ${s} fileleri sarstı!`);
            showPitchBanner('KORNER GOLÜ!',s,'goal');
          }else{
            M.mo=C(M.mo+7,8,92);addLog('taktik','Kornerde vuruş direkten döndü!');
          }
        });
      }else{
        this.finish(false,'ISKALADIN!','Topa doğru anda vuramadın.',()=>{
          addLog('taktik','Kornerde savunma topu uzaklaştırdı.');
        });
      }
    };
    const b1=$('mg-cr-btn'),b2=$('mg-cr-area');
    if(b1)b1.onpointerdown=head;
    if(b2)b2.onpointerdown=head;
  },

  /* 6) PRES TUZAĞI (press - BUG FIX 4: 1100ms aralık, 4500ms toplam süre, 3'lü veya 4'lü + Kaleciye Geri Pas) */
  play_press(){
    const isFour=Math.random()<0.5;
    const pos=isFour
      ?[{x:52,y:105},{x:150,y:122},{x:248,y:105},{x:150,y:38}]
      :[{x:60,y:95},{x:150,y:52},{x:240,y:95}];
    let holder=0,weakAt=-1,step=0,done=false;
    const weakStep=R(2,3);

    const draw=()=>{
      const h=pos[holder];
      return`<svg viewBox="0 0 300 155" width="100%" height="155" style="display:block">
        <line x1="${pos[0].x}" y1="${pos[0].y}" x2="${pos[1].x}" y2="${pos[1].y}" stroke="rgba(255,255,255,.22)" stroke-width="2" stroke-dasharray="4 4"/>
        <line x1="${pos[1].x}" y1="${pos[1].y}" x2="${pos[2].x}" y2="${pos[2].y}" stroke="rgba(255,255,255,.22)" stroke-width="2" stroke-dasharray="4 4"/>
        ${isFour?`<line x1="${pos[1].x}" y1="${pos[1].y}" x2="${pos[3].x}" y2="${pos[3].y}" stroke="rgba(255,255,255,.22)" stroke-width="2" stroke-dasharray="4 4"/>`:''}
        ${pos.map((p,i)=>{
          const isWeak=i===weakAt;
          const lbl=isWeak?'KAP!':(isFour&&i===3?'KL':'DEF');
          return`<g style="cursor:pointer" onpointerdown="MG.pressTap(${i})">
            ${isWeak?`<circle cx="${p.x}" cy="${p.y}" r="30" fill="rgba(250,204,21,.28)" stroke="#facc15" stroke-width="3.5"/>`:''}
            <circle cx="${p.x}" cy="${p.y}" r="22" fill="${isWeak?'#eab308':(isFour&&i===3?'#f59e0b':'#dc2626')}" stroke="#fff" stroke-width="2.5"/>
            <text x="${p.x}" y="${p.y+5}" text-anchor="middle" fill="${isWeak||(isFour&&i===3)?'#111':'#fff'}" font-size="11" font-weight="900">${lbl}</text>
          </g>`;
        }).join('')}
        <circle cx="${h.x+16}" cy="${h.y-16}" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
      </svg>`;
    };

    S(`${mh()}
      <div class="mg-card">
        <div class="mg-cmd" id="mg-pr-cmd">Sarı "ZAYIF KONTROL" anını bekle!</div>
        <div class="mg-timer"><i id="mg-pr-tm" style="width:100%;transition:width 4500ms linear"></i></div>
        <div class="mg-svg-wrap" id="mg-pr-svg">${draw()}</div>
      </div>
    `);
    addTo(()=>{const el=$('mg-pr-tm');if(el)el.style.width='0%'},30);

    addIv(()=>{
      if(done)return;
      step++;
      if(isFour&&step===weakStep)holder=3;
      else holder=(holder+R(1,pos.length-1))%pos.length;
      weakAt=(step===weakStep)?holder:-1;
      const cmd=$('mg-pr-cmd'),svg=$('mg-pr-svg');
      if(cmd)cmd.textContent=weakAt>=0?(isFour&&holder===3?'KALECİ ZAYIF KONTROL! HEMEN KAP!':'ZAYIF KONTROL! HEMEN DOKUN!'):'Paslaşmayı izle, sabırlı ol...';
      if(svg)svg.innerHTML=draw();
    },1100);

    this.pressTap=(i)=>{
      if(done||this.locked)return;
      done=true;clearTimers();
      if(i===weakAt){
        const isGoal=Math.random()<0.68;
        this.finish(true,isGoal?'PRES GOLÜ!':'ÖNDE TOPU KAPTIN!',isGoal?'Önde presle topu kapıp hemen cezalandırdın!':'Hatalı pastan topu kaptın, büyük baskı!',()=>{
          const M=G.m;M.sh++;
          if(isGoal){
            const s=scr();M.gf++;M.evMarks.push({m:M.min,type:'gf'});SFX.goal();
            addLog('gol',`Önde presle topu kapan ${s} golü attı!`);
            showPitchBanner('PRES GOLÜ!',s,'goal');
          }else{
            M.ba+=0.18;M.mo=C(M.mo+10,8,92);addLog('taktik','Önde pres tuzağı tuttu, rakip bunaldı.');
          }
        });
      }else{
        this.finish(false,'PRES BOŞA ÇIKTI!','Rakip kolayca pasla baskıdan çıktı.',()=>{
          G.m.bd+=0.08;addLog('taktik','Erken pres hamlesi boşluk bıraktı.');
        });
      }
    };

    addTo(()=>{
      if(!done&&!this.locked){
        done=true;
        this.finish(false,'RAKİP BASKIDAN ÇIKTI!','4.5 saniyede topu kapamadın.',()=>{
          addLog('taktik','Rakip savunma baskıdan rahat çıktı.');
        });
      }
    },4500);
  },

  /* 7) NABIZ DENGELEME (kart - 2 Senaryo: Hakeme İtiraz / Rakip Tahriki) */
  play_kart(){
    const x=this.demoMode?{id:0,n:'Yıldız Oyuncu'}:P(G.m.xi.map(i=>DB.pl[i]).filter(Boolean));
    const scen=R(0,1);
    let valPos=48,safeMs=0,done=false;
    const needMs=2200;
    const basePull=scen===1?0.78:0.66;
    const pull=(this.demoMode?basePull:basePull+Math.max(0,G.m.yc)*0.11);

    S(`${mh()}
      <div class="mg-card">
        <div class="mg-cmd">${E(x.n)} ${scen===1?'rakip tahrikiyle çileden çıktı!':'hakeme itiraz ediyor!'} Yeşilde tut!</div>
        <div class="mg-bar" style="height:32px">
          <div class="mg-zn" style="left:28%;width:42%"></div>
          <div style="position:absolute;right:0;top:0;bottom:0;width:14%;background:rgba(239,68,68,.55)"></div>
          <div class="mg-mk" id="mg-kt-mk" style="left:48%"></div>
        </div>
        <div class="r" style="font-size:12px;margin:4px 0"><span>Sakinleşme Süresi</span><b class="num" id="mg-kt-st">0.0 / 2.2 sn</b></div>
        <div class="mg-timer"><i id="mg-kt-pr" style="width:0%;background:#10b981"></i></div>
        <button class="ok-btn" id="mg-kt-btn" style="min-height:54px;font-size:16px;margin-top:8px">${ico('shield',18)} SAKİNLEŞTİR (DOKUN!)</button>
      </div>
    `);

    const mkEl=$('mg-kt-mk'),stEl=$('mg-kt-st'),prEl=$('mg-kt-pr');
    addIv(()=>{
      if(done)return;
      valPos+=pull;
      if(valPos>=92){
        done=true;
        this.finish(false,'KIRMIZI KART!',`${x.n} ${scen===1?'rakibine yaptığı hareketten':'hakeme itirazdan'} atıldı (1 maç ceza).`,()=>{
          const M=G.m;M.rc++;M.fl.red=1;M.ba-=0.24;M.bd+=0.20;
          M.redIds.push(x.id);M.evMarks.push({m:M.min,type:'rc'});
          M.xi=M.xi.filter(i=>i!==x.id);SFX.card();
          addLog('kart-r',`${x.n} kırmızı kartla oyun dışı kaldı (1 maç ceza).`);
          showPitchBanner('KIRMIZI KART!',x.n,'card');
        });
        return;
      }
      if(valPos>=28&&valPos<=70){
        safeMs+=30;
        if(safeMs>=needMs){
          done=true;
          this.finish(true,'OYUNCU SAKİNLEŞTİ!',`${x.n} öfkesini kontrol etti, kart önlendi.`,()=>{
            addLog('kart',`${x.n} sakinleştirildi, kırmızı kart tehlikesi atlatıldı.`);
          });
          return;
        }
      }
      if(mkEl)mkEl.style.left=C(valPos,2,94)+'%';
      if(stEl)stEl.textContent=`${(safeMs/1000).toFixed(1)} / 2.2 sn`;
      if(prEl)prEl.style.width=`${Math.min(100,(safeMs/needMs)*100)}%`;
    },30);

    const calm=()=>{
      if(done||this.locked)return;
      SFX.tap();
      valPos=Math.max(12,valPos-11.5);
      if(mkEl)mkEl.style.left=valPos+'%';
    };
    const btn=$('mg-kt-btn');
    if(btn)btn.onpointerdown=calm;
  },

/* ==================== POST-MATCH, ULTIMATUM & PRESS CONFERENCE ==================== */
function fin2(fromPen=false){
  clearTimers();mdx();
  const M=G.m,n=M.n,r=M.gf>M.ga?1:M.gf<M.ga?-1:0;

  if(!fromPen&&(n.t==='c'||n.t==='e')&&M.gf===M.ga){
    return penShootout();
  }

  const ok=r>0||(M.penRes&&M.penRes.won);
  const penStr=M.penRes?` (Pen: ${M.penRes.my}-${M.penRes.op})`:'';
  const cp=G.cap!==null&&M.playedIds.includes(G.cap);
  const prevTb=JSON.stringify(G.tb);
  let ex='';

  recordMatchStats(M.gf,M.ga,CN(n.op));

  if(n.t==='l'){
    G.fx[n.r].forEach(([h,a])=>{
      if(h===G.cid||a===G.cid)res(h,a,h===G.cid?M.gf:M.ga,h===G.cid?M.ga:M.gf);
      else{const[x,y]=sim(h,a);res(h,a,x,y)}
    });
  }else if(n.t==='e'){
    const mult=ecoInf();
    if(ok){
      G.eurR++;G.xp+=20;
      if(G.eurR===3){
        const prize=Math.round(35*mult);
        G.eurWon=1;G.stats.euroCups++;G.cash+=prize;
        G.fans=C(G.fans+15,0,100);G.board=C(G.board+15,0,100);G.med=C(G.med+12,0,100);G.xp+=60;
        ex=`${M.penRes?'Penaltılarla ':''}AVRUPA ŞAMPİYONU OLDUN! (+${prize} M Ödül & Özel CV Rozeti)`;
      }else{
        const prize=Math.round((G.eurR===1?8:12)*mult);
        G.cash+=prize;
        ex=`${M.penRes?'Penaltılarla tur atladın! ':'Avrupa Kupası\'nda üst tura yükseldin! '}(+${prize} M)`;
      }
    }else{
      G.euro=0;ex=M.penRes?'Penaltılarla Avrupa Kupası\'ndan elendin.':'Avrupa Kupası maceran bu turda sona erdi.';
    }
  }else{
    if(ok){
      G.cr++;G.xp+=15;
      if(G.cr===3){G.stats.natCups++;G.fans=C(G.fans+12,0,100);G.xp+=40;ex=`${M.penRes?'Penaltılarla ':''}ULUSAL KUPA ŞAMPİYONU OLDUN!`}
      else ex=M.penRes?'Penaltılarla tur atladın!':'Kupada bir üst tura yükseldin.';
    }else{G.cup=0;ex=M.penRes?'Penaltılarla kupadan elendin.':'Kupaya veda ettin.'}
  }

  G.xp+=r>0?10:r===0?3:0;
  while(G.xp>=30){G.xp-=30;G.sp++}
  G.strk=r<0?G.strk+1:0;

  G.board=C(G.board+r*3,0,100);
  G.fans=C(G.fans+r*3,0,100);
  G.sq=C(G.sq+r*2+(cp&&r<0?1:0),0,100);

  if(n.home){
    let base=(3.4+G.fac[3]*1.4)*Math.min(1.5,ecoInf());
    let rev=base*(1+[-0.15,0,0.28][G.tp]+(fill()-70)/200);
    if(G.fans<35)rev*=0.65;
    if(hm('prot')){rev*=0.5;const pm=G.mods.find(m=>m.id==='prot');if(pm)pm.w--}
    G.cash+=Math.max(0.5,rev);
    if(G.tp===0)G.fans=C(G.fans+1,0,100);
    if(G.tp===2&&fill()<60)G.fans=C(G.fans-1,0,100);
  }
  if(r>0&&G.spon===1)G.cash+=4.5*ecoInf();

  if(G.derby&&G.derby.stance===1){
    if(r>0){G.fans=C(G.fans+6,0,100);G.med=C(G.med+4,0,100);ex+=' Derbi söz düellosunu sahada kazandın.'}
    else if(r<0){G.med=C(G.med-6,0,100);G.board=C(G.board-4,0,100);ex+=' Derbi öncesi büyük konuştun ama sahada kaybettin.'}
  }
  G.derby=null;

  if(G.scen==='chaos'&&r<0&&Math.random()<0.55){
    G.med=C(G.med-5,0,100);
    G.mods=G.mods.filter(m=>m.id!=='media');G.mods.push({id:'media',w:3});
  }

  let ultNote='';
  if(G.ult){
    const earned=r>0?3:r===0?1:0;
    G.ult.pts+=earned;G.ult.left--;
    if(G.ult.pts>=G.ult.need){
      G.ult=null;G.board=C(G.board+14,0,100);
      ultNote='Ültimatomu başarıyla atlattın. Yönetim güveni yenilendi (+14).';
    }else if(G.ult.left<=0){
      return fired(`Yönetim ültimatomu başarısız oldu (${G.ult.pts}/${G.ult.need} puan). Görevine son verildi.`);
    }else{
      ultNote=`Ültimatom sürüyor: ${G.ult.left} maç kaldı (${G.ult.pts}/${G.ult.need} puan).`;
    }
  }

  const injRed=G.fac[2]*0.01+G.stf[2]*0.012;
  const playedSet=new Set(M.playedIds);
  G.lastPlayedIds=M.playedIds.slice();

  DB.pl.filter(x=>x.c===G.cid).forEach(x=>{
    const played=playedSet.has(x.id);
    if(played){
      x.bnStrk=0;
      if(x.prom>0)x.prom--;
      x.k=Math.max(10,Math.round(x.k));
      x.m=C(x.m+r*(cp?3:4),0,100);
      x.f=C(x.f+r*4,0,100);
      const risk=(x.k<52?0.07+0.03*G.agg:x.k<68?0.025+0.015*G.agg:0.012)-injRed+(x.tp===3?0.035:0);
      if(Math.random()<Math.max(0.004,risk))x.i=R(1,3);
    }else{
      if(x.sus>0)x.sus--;
      if(!x.i)x.bnStrk=(x.bnStrk||0)+1;
      x.m=C(x.m-(x.tp===1?3:1),0,100);
      if(x.tp===1&&x.m<35)G.sq=C(G.sq-1,0,100);
      if(x.prom>0&&!x.i){
        x.prom=0;x.m=C(x.m-15,0,100);
        if(!G.later.some(l=>l.id==='star_leak'))G.later.push({id:'star_leak',w:0,pid:x.id});
      }else if(x.o>=75&&x.bnStrk>=2&&!x.i&&!G.later.some(l=>l.id==='benched_star')){
        G.later.push({id:'benched_star',w:0,pid:x.id});
      }
    }
  });
  M.redIds.forEach(rid=>{const rx=DB.pl[rid];if(rx)rx.sus=1});
  fixXI(false);

  if(n.t==='l'){
    const old=JSON.parse(prevTb),L=[];
    G.fx[n.r].forEach(([h,a])=>{
      if(h!==G.cid&&a!==G.cid){
        const x=G.tb[h].gf-old[h].gf,y=G.tb[a].gf-old[a].gf;
        L.push(`${CN(h)} ${x}-${y} ${CN(a)}`);
        [[h,x],[a,y]].forEach(([cid,g])=>{
          for(let i=0;i<g;i++){const fs=DB.pl.filter(q=>q.c===cid&&q.p>=2);if(fs.length){const z=P(fs);z.g=(z.g||0)+1}}
        });
      }
    });

const STAT_LBL={board:'Yönetim',fans:'Taraftar',sq:'Soyunma Odası',med:'Medya',cash:'Kasa'};

function ap(e){
  const log=[];
  for(const k in e){
    const v=e[k];
    if(k==='inj'){
      const x=P(hl(G.cid));
      if(x){x.i=v;fixXI(false);log.push({t:`${x.n} (${v} hafta sakat)`,c:'neg'})}
    }else if(k==='wk'){
      const p=mk(nm(),G.cid,P([1,2,3]),R(58,66),17,4,R(82,91));
      log.push({t:`Wonderkid: ${p.n} (${p.o})`,c:'pos'});
    }else if(k==='mod'){
      G.mods=G.mods.filter(m=>m.id!==v);
      G.mods.push({id:v,w:MD[v].w});
      if(v==='disc'){G.board=C(G.board+5,0,100);log.push({t:`Yönetim +5`,c:'pos'})}
      log.push({t:`Yeni Etki: ${MD[v].n} (${MD[v].w}h)`,c:'neu'});
    }else if(k==='lt'){
      G.later.push(typeof v==='string'?{id:v,w:2}:v);
    }else if(k==='rep'){
      for(const rk in v){addRep(rk,v[rk]);log.push({t:`İtibar: ${REP_META[rk].n} +${v[rk]}`,c:'info'})}
    }else if(k==='prom'&&G.evPid!==undefined){
      const px=DB.pl[G.evPid];if(px){px.prom=2;px.m=C(px.m+10,0,100);log.push({t:`${px.n} İlk 11 Sözü`,c:'neu'})}
    }else if(k==='sellStar'&&G.evPid!==undefined){
      const px=DB.pl[G.evPid];
      const squadCnt=DB.pl.filter(q=>q.c===G.cid).length;
      if(px&&px.c===G.cid&&squadCnt>13){
        const fee=Math.round(val(px)*1.25);G.cash+=fee;
        px.c=P(DB.clubs.filter(c=>c.id!==G.cid)).id;
        if(G.cap===px.id)G.cap=null;fixXI(false);
        log.push({t:`Kasa +${fee} M (${px.n} satıldı)`,c:'pos'});
      }else{
        log.push({t:'Kadro dar olduğu için satış iptal edildi',c:'neu'});
      }
    }else if(k in STAT_LBL){
      const before=G[k];
      G[k]=k==='cash'?G[k]+v:C(G[k]+v,0,100);
      const diff=k==='cash'?v:G[k]-before;
      if(diff!==0){
        const sign=diff>0?'+':'';
        log.push({t:`${STAT_LBL[k]} ${sign}${k==='cash'?diff+' M':diff}`,c:diff>0?'pos':'neg'});
      }
    }
  }
  return log;
}

/* ==================== SEASON AWARDS, TEAM OF THE YEAR & END SEASON ==================== */
function computeSeasonAwards(userRank){
  const activePl=DB.pl.filter(x=>x.c>=0);
  const topScorer=activePl.slice().sort((a,b)=>(b.g||0)-(a.g||0)||b.o-a.o)[0];
  const youngPlayer=activePl.filter(x=>x.a<=22).sort((a,b)=>(b.o+(b.g||0)*1.5+b.f*0.1)-(a.o+(a.g||0)*1.5+a.f*0.1))[0]||activePl[0];

  const rk=rank();
  let bestMgrCid=rk[0],bestScore=-999;
  rk.forEach((cid,idx)=>{
    const exp=powerRank(cid);
    const sc=(exp-(idx+1))*2+(idx===0?5:0);
    if(sc>bestScore){bestScore=sc;bestMgrCid=cid}
  });
  const mgrOfYear=bestMgrCid===G.cid?`${CN(G.cid)} (Sen)`:`${CN(bestMgrCid)} T.D.`;

  const perf=x=>x.o+(x.g||0)*1.2+x.f*0.08;
  const pickPos=(p,n)=>activePl.filter(x=>x.p===p).sort((a,b)=>perf(b)-perf(a)).slice(0,n);
  const xi=[...pickPos(0,1),...pickPos(1,4),...pickPos(2,3),...pickPos(3,3)];

  const trophies=[userRank===1?'Lig':null,G.cr===3?'Kupa':null,G.eurWon?'Avrupa':null].filter(Boolean).join(', ');
  const aw={
    season:G.season,club:CN(G.cid),rank:userRank,trophies,
    topScorer:topScorer?`${topScorer.n} (${topScorer.g||0}G)`:'-',
    youngPlayer:youngPlayer?`${youngPlayer.n} (${youngPlayer.o})`:'-',
    mgrOfYear,
    xi:xi.map(x=>({n:x.n,p:PN[x.p],o:x.o,g:x.g||0,mine:x.c===G.cid,club:CN(x.c)}))
  };
  G.hallOfFame=G.hallOfFame||[];
  G.hallOfFame.push({season:aw.season,club:aw.club,rank:aw.rank,trophies:aw.trophies,topScorer:aw.topScorer,youngPlayer:aw.youngPlayer,mgrOfYear:aw.mgrOfYear});
  return aw;
}

function endSeason(){
  clearTimers();mdx();
  const k=rank().indexOf(G.cid)+1,ok=checkObj(k);
  const mult=ecoInf();
  if(k===1)G.stats.leagueCups++;

  const tags=[
    `${k}. sıra`,
    G.cr===3?'Kupa Şampiyonu':'',
    G.eurWon?'Avrupa Şampiyonu':'',
    `Hedef ${ok?'Başarılı':'Başarısız'}`
  ].filter(Boolean).join(' · ');
  G.hist.push(`Sezon ${G.season} (${CN(G.cid)}): ${tags}`);

  const awards=computeSeasonAwards(k);

  if(G.spon===2&&k===1)G.cash+=Math.round(55*mult);
  if(ok)G.cash+=G.obj.rew;
  G.board=C(G.board+(k<=3?10:k<=8?2:-12)+(ok?10:-12),0,100);
  G.fans=C(G.fans+(k<=3?8:-3),0,100);
  G.ult=null;

  G.nextEuro=(k<=3||G.cr===3)?1:0;

  const ythBonus=(G.scen==='rising'?2:0)+(G.campBonus?3:0);
  DB.pl.forEach(x=>{
    if(x.c<0)return;
    x.a++;x.ct--;x.bnStrk=0;x.prom=0;x.sus=0;
    if(x.pot===undefined)x.pot=calcPot(x.c,x.o,x.a,x.tp);
    let prog=0;
    if(x.a<=24){
      const gap=Math.max(0,x.pot-x.o);
      if(gap>0){
        const step=R(1,3)+(gap>=10?1:0)+(x.tp===4?1:0)+(x.c===G.cid?ythBonus:0);
        prog=Math.min(gap,step);
      }else prog=R(0,1);
    }else if(x.a<=29){
      prog=x.o<x.pot?R(0,2):R(-1,1);
    }else if(x.a<=32){
      prog=R(-1,0);
    }else{
      prog=-R(1,3);
    }
    x.o=C(x.o+prog,42,94);x.i=0;x.k=100;
    if(x.a>35)regenPlayer(x);
  });

  updateClubStrengths();

  if(G.board<scenCfg().fireTh)return fired(ok?'Yönetim güvenini kaybetti.':'Sezon hedefi tutmadı, yönetim yollarını ayırdı.');

  const offers=(k<=4||G.board>=75)
    ?DB.clubs.filter(c=>c.id!==G.cid&&c.s>=DB.clubs[G.cid].s-2).sort(()=>Math.random()-0.5).slice(0,2).map(c=>c.id)
    :[];
  G.es={k,ok,o:offers,nextEuro:G.nextEuro,awards};
  esUI();
}

function rn(id){
  const x=DB.pl[id],c=renewCost(x);
  if(G.cash<c){toast('Bütçe yetersiz.','bad');return}
  SFX.ok();G.cash-=c;x.ct=R(2,3);
  toast(`${x.n} ile ${x.ct} yıllık yeni sözleşme imzalandı (-${c} M).`,'ok');
  esUI();
}

function rnAll(){
  const ex=DB.pl.filter(x=>x.c===G.cid&&x.ct<=0).sort((a,b)=>b.o-a.o);
  let cnt=0,spent=0;
  for(const x of ex){
    const c=renewCost(x);
    if(G.cash>=c){
      G.cash-=c;x.ct=R(2,3);cnt++;spent+=c;
    }
  }
  if(cnt>0){SFX.ok();toast(`${cnt} oyuncunun sözleşmesi yenilendi (-${spent} M).`,'ok')}
  else toast('Bütçeye uygun yenilenecek oyuncu yok.','warn');
  esUI();
}

function esUI(){
  const{k,ok,o,nextEuro,awards}=G.es;
  const ex=DB.pl.filter(x=>x.c===G.cid&&x.ct<=0).sort((a,b)=>b.o-a.o);
  const canAny=ex.some(x=>G.cash>=renewCost(x));
  S(`
    <div class="hd">
      <div class="r">
        <span class="bd">SEZON ${G.season} TAMAMLANDI</span>
        <span class="bd num" style="background:rgba(16,185,129,.28);border-color:rgba(16,185,129,.6)">${ico('cash',12)} Mevcut Bütçe: ${G.cash.toFixed(1)} M</span>
      </div>
      <div class="big" style="margin-top:6px">${k}. Sırada Bitirdin</div>
      <p style="margin:6px 0 0">Hedef: ${E(G.obj.label)} — ${ok?`Başarılı (+${G.obj.rew} M, +10 Yönetim)`:'Başarısız (-12 Yönetim)'}</p>
      ${nextEuro?`<div style="margin-top:6px"><span class="pill euro">${ico('globe',11)} Gelecek Sezon Avrupa Kupası'na Katılım Hakkı!</span></div>`:''}
    </div>
    ${awards?`
      <div class="c">
        <span class="lbl">${ico('crown',13)} Sezon Ödülleri & Yılın 11'i</span>
        <div class="c2" style="margin:6px 0">
          <div class="r"><span>Gol Kralı</span><b>${E(awards.topScorer)}</b></div>
          <div class="r"><span>Yılın Genç Oyuncusu</span><b>${E(awards.youngPlayer)}</b></div>
          <div class="r"><span>Yılın Menajeri</span><b>${E(awards.mgrOfYear)}</b></div>
        </div>
        <span class="lbl" style="margin-top:8px">${ico('star',12)} Yılın 11'i (Senin Oyuncuların Vurgulu)</span>
        <div>
          ${awards.xi.map(p=>`<span class="chip ${p.mine?'sel':''}" style="cursor:default"><b>${p.p}</b> ${E(p.n)} <b>${p.o}</b> <span class="m">${E(p.club.slice(0,6))}</span></span>`).join('')}
        </div>
      </div>
    `:''}
    ${ex.length?`
      <div class="c">
        <div class="r">
          <span class="lbl" style="margin:0">${ico('clock',13)} Sözleşmesi Biten Oyuncular (${ex.length})</span>
          <span class="pill info num" style="margin:0">Mevcut Bütçe: ${G.cash.toFixed(1)} M</span>
        </div>
        <p class="m" style="margin:4px 0 8px">Yenilemezsen yeni sezon başında serbest kalırlar.</p>
        <button class="ok-btn" style="margin-bottom:8px" ${canAny?'':'disabled'} onclick="rnAll()">${ico('check',14)} Uygun Olanların Tümünü Yenile</button>
        ${ex.map(x=>{
          const cost=renewCost(x),poor=G.cash<cost;
          return`<button class="x r" ${poor?'disabled':''} onclick="rn(${x.id})">
            <span><b>${E(x.n)}</b> · ${PN[x.p]} · ${x.a} yaş · <b>OVR ${x.o}</b></span>
            <span class="pill ${poor?'neg':'pos'} num" style="margin:0">${poor?`Bütçe Yetersiz (${cost} M)`:`Yenile · ${cost} M`}</span>
          </button>`;
        }).join('')}
      </div>
    `:''}
    ${o.length?`
      <div class="c">
        <span class="lbl">${ico('club',13)} Yeni İş Teklifleri</span>
        ${o.map(i=>`<button class="x" onclick="job(${i})">${clubCrestSVG(i,22)} <span>${E(CN(i))} (Güç ${Math.round(DB.clubs[i].s)}) Kulübüne Geç</span></button>`).join('')}
      </div>
    `:''}
    <button onclick="SFX.tap();newSeason()">${ico('play',14)} ${E(CN(G.cid))} ile Yeni Sezona Başla</button>
  `);
}

function balanceAISquads(){
  DB.clubs.forEach(c=>{
    if(c.id===G.cid)return;
    let list=DB.pl.filter(x=>x.c===c.id);
    if(list.length>22){
      list.sort((a,b)=>(a.o-a.a*0.5)-(b.o-b.a*0.5));
      const excess=list.length-22;
      for(let i=0;i<excess;i++){list[i].c=-1}
      list=DB.pl.filter(x=>x.c===c.id);
    }
    while(list.length<17){
      const baseS=c.baseS||c.s||65;
      const ovr=baseS>=75?R(60,72):baseS>=65?R(55,66):R(50,61);
      const hasGK=list.some(x=>x.p===0);
      const p=mk(nm(),c.id,hasGK?P([1,2,3]):0,ovr,R(18,21));
      list.push(p);
    }
  });
}

function newSeason(){
  G.season++;G.wk=0;G.tb=newTb();G.cup=1;G.cr=0;
  G.euro=G.nextEuro?1:0;G.eurR=0;G.eurWon=0;G.nextEuro=0;
  G.eurOps=[];ensureEuroOps();
  G.pr=0;G.strk=0;G.spon=null;G.cal=mkCal();G.s1=null;G.mktRef=0;
  G.ffpApplied=0;G.campBonus=0;G.invCamp=0;G.invScout=0;G.scoutStarId=null;

  DB.pl.forEach(x=>{
    if(x.c<0)return;
    if(x.ct<=0){
      if(x.c===G.cid){
        x.c=-1;
        if(G.cap===x.id)G.cap=null;
      }else if(DB.pl.filter(q=>q.c===x.c).length>18&&Math.random()<0.45){
        x.c=-1;
      }else{
        x.ct=R(1,3);
      }
    }
    x.k=100;x.g=0;x.sus=0;
  });

  balanceAISquads();
  ensureFreeAgents();
  ensureMinSquad(G.cid,true);
  updateClubStrengths();
  G.obj=newObj();genMkt();genYth();
  G.xi=autoSlots(G.cid,G.f,false);
  if(G.cap===null||!DB.pl[G.cap]||DB.pl[G.cap].c!==G.cid){
    const best=DB.pl.filter(x=>x.c===G.cid).sort((a,b)=>(b.tp===0?1:0)-(a.tp===0?1:0)||b.o-a.o)[0];
    G.cap=best?best.id:null;
  }
  render();
}

function job(c){
  syncClubInfraToDB();
  const nextEuroForNew=rank().indexOf(c)<3?1:0;
  DB.pl.forEach(x=>{if(x.c===c&&x.ct<=0)x.ct=1});

  G.cid=c;
  G.scen='free';
  G.board=62;G.fans=62;G.sq=62;
  G.cash=Math.round(DB.clubs[c].s*0.55);
  G.f='4-3-3';
  G.fac=DB.clubs[c].fac.slice();
  G.stf=DB.clubs[c].stf.slice();
  G.tp=DB.clubs[c].tp;

  G.later=[];G.mods=[];G.ult=null;G.derby=null;G.scd={};G.news=[];G.s1=null;
  G.nextEuro=nextEuroForNew;

  const myPl=DB.pl.filter(x=>x.c===c).sort((a,b)=>(b.tp===0?2:0)-(a.tp===0?2:0)||b.o-a.o);
  G.cap=myPl[0]?myPl[0].id:null;
  toast(`${CN(c)} kulübünde göreve başladın! Bütçe: ${G.cash} M`,'ok',3200);
  newSeason();
}

function fired(m){
  clearTimers();mdx();
  try{localStorage.removeItem('mfc')}catch(e){}
  S(`
    <div class="hd" style="background:linear-gradient(135deg,#991b1b,#3b0a0a)">
      <span class="bd">KARİYER SONA ERDİ</span>
      <div class="big" style="margin-top:6px">Görevden Alındın</div>
      <p style="margin:6px 0 0">${E(m)}</p>
    </div>
    <div class="c">
      <span class="lbl">${ico('medal',13)} Kariyer Özeti</span>
      <div class="m">${G.hist.map(E).join('<br>')||'İlk sezonda veda ettin.'}</div>
    </div>
    <button onclick="gen();menu()">Ana Menüye Dön</button>
  `);
}

/* ==================== BOOTSTRAP ==================== */
gen();
menu();
</script>
